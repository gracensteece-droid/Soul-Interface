      nSrc.connect(nFilt); nFilt.connect(nFilt2); nFilt2.connect(nGain);
      nGain.connect(master); nGain.connect(reverb);
      nSrc.start(t0); nSrc.stop(t0 + 6.5);

      // Layer 4: Harmonic ring-out — the sun finding its resonant frequency
      [110, 220, 330, 440, 660].forEach((f, i) => {
        const o = AC.createOscillator();
        const g = AC.createGain();
        o.type = 'sine'; o.frequency.value = f;
        const delay = 0.2 + i * 0.12;
        g.gain.setValueAtTime(0, t0 + delay);
        g.gain.linearRampToValueAtTime(0.12 - i*0.02, t0 + delay + 0.05);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + delay + 5 + i * 1.5);
        o.connect(g); g.connect(reverb); g.connect(master);
        o.start(t0 + delay); o.stop(t0 + delay + 6 + i * 2);
      });
    },

    // Crystalline ping per planet
    planetPing: (index) => {
      const freqs = [1047, 880, 784, 659, 523, 440, 392, 330, 294];
      const f     = freqs[index % freqs.length];
      const osc   = AC.createOscillator();
      const env   = AC.createGain();
      osc.type = 'sine'; osc.frequency.value = f;
      env.gain.setValueAtTime(0,    AC.currentTime);
      env.gain.linearRampToValueAtTime(0.09, AC.currentTime + 0.02);
      env.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 2.5);
      osc.connect(env); env.connect(reverb); env.connect(master);
      osc.start(); osc.stop(AC.currentTime + 3);
    },

    // Ice crystal shimmer sweep — frost line
    frostSweep: () => {
      const osc  = AC.createOscillator();
      const env  = AC.createGain();
      const filt = AC.createBiquadFilter();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(2000, AC.currentTime);
      osc.frequency.linearRampToValueAtTime(4000, AC.currentTime + 3);
      osc.frequency.linearRampToValueAtTime(1500, AC.currentTime + 6);
      filt.type = 'bandpass'; filt.frequency.value = 3000; filt.Q.value = 2;
      env.gain.setValueAtTime(0,    AC.currentTime);
      env.gain.linearRampToValueAtTime(0.06, AC.currentTime + 1);
      env.gain.linearRampToValueAtTime(0,    AC.currentTime + 6);
      osc.connect(filt); filt.connect(env); env.connect(reverb); env.connect(master);
      osc.start(); osc.stop(AC.currentTime + 6.5);
    },

    // Realistic impact — sharp crack + rumble + debris hiss
    impactThud: () => {
      const t0 = AC.currentTime;
      const intensity = 0.5 + Math.random() * 0.5; // random intensity per hit

      // Sharp transient crack — the moment of impact
      const crackBuf = AC.createBuffer(1, AC.sampleRate * 0.05, AC.sampleRate);
      const cd = crackBuf.getChannelData(0);
      for (let i = 0; i < cd.length; i++) {
        cd[i] = (Math.random()*2-1) * Math.pow(1 - i/cd.length, 0.3);
      }
      const crack = AC.createBufferSource();
      const crackF = AC.createBiquadFilter();
      const crackG = AC.createGain();
      crack.buffer = crackBuf;
      crackF.type = 'highpass'; crackF.frequency.value = 1500;
      crackG.gain.value = intensity * 0.8;
      crack.connect(crackF); crackF.connect(crackG); crackG.connect(master);
      crack.start(t0); crack.stop(t0 + 0.1);

      // Deep impact thud — pitch-drops fast
      const thud  = AC.createOscillator();
      const thudG = AC.createGain();
      const thudF = AC.createBiquadFilter();
      thud.type = 'sine';
      thud.frequency.setValueAtTime(180 + Math.random()*80, t0);
      thud.frequency.exponentialRampToValueAtTime(20, t0 + 0.25);
      thudF.type = 'lowpass'; thudF.frequency.value = 300;
      thudG.gain.setValueAtTime(intensity * 0.9, t0);
      thudG.gain.exponentialRampToValueAtTime(0.001, t0 + 0.5);
      thud.connect(thudF); thudF.connect(thudG); thudG.connect(master);
      thud.start(t0); thud.stop(t0 + 0.6);

      // Debris hiss — short noise tail
      const hissBuf = AC.createBuffer(1, AC.sampleRate * 0.4, AC.sampleRate);
      const hd = hissBuf.getChannelData(0);
      for (let i = 0; i < hd.length; i++) {
        hd[i] = (Math.random()*2-1) * Math.pow(1 - i/hd.length, 1.5);
      }
      const hiss  = AC.createBufferSource();
      const hissF = AC.createBiquadFilter();
      const hissG = AC.createGain();
      hiss.buffer = hissBuf;
      hissF.type = 'bandpass'; hissF.frequency.value = 3000 + Math.random()*2000; hissF.Q.value = 1.5;
      hissG.gain.value = intensity * 0.2;
      hiss.connect(hissF); hissF.connect(hissG); hissG.connect(master);
      hiss.start(t0 + 0.02); hiss.stop(t0 + 0.5);
    },

    // Long reverb fade — outer reaches
    outerFade: () => {
      const osc = AC.createOscillator();
      const env = AC.createGain();
      osc.type = 'sine'; osc.frequency.value = 110;
      env.gain.setValueAtTime(0,    AC.currentTime);
      env.gain.linearRampToValueAtTime(0.06, AC.currentTime + 2);
      env.gain.linearRampToValueAtTime(0,    AC.currentTime + 10);
      osc.connect(env); env.connect(reverb); env.connect(master);
      osc.start(); osc.stop(AC.currentTime + 11);
    },
  };

  }; // end _startAudio inner
})(); // end lazy wrapper

// ── Render loop ───────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
// Pre-allocated temporaries for depth flare orientation (avoid per-frame GC)
const _dfX = new THREE.Vector3(), _dfY = new THREE.Vector3();
const _dfZ = new THREE.Vector3(0, 1, 0), _dfM = new THREE.Matrix4();

function animate() {
  requestAnimationFrame(animate);
  const t   = clock.getElapsedTime();
  const now = performance.now();
  const dt  = (now - lastNow) / 1000;
  lastNow   = now;

  // ── Cosmogenesis sequencer ────────────────────────────────────────────────
  if (cosmoActive && !cosmoPaused && phaseStart !== null && phaseIndex < PHASES.length) {
    const phase   = PHASES[phaseIndex];
    const elapsed = now - phaseStart;
    const pct     = Math.min(1, elapsed / phase.duration);
    phase.fn(pct, dt);
    if (elapsed >= phase.duration) {
      phaseIndex++;
      phaseStart = now;
      showPhase(phaseIndex);
    }
  }

  // ── Normal idle animation (post-cosmo or always for sun) ─────────────────
  if (!cosmoActive) {
    sunLight.intensity = 7.5 + Math.sin(t * 1.1) * 0.6;
    sunMesh.scale.setScalar(1 + Math.sin(t * 0.85) * 0.022);
  }
  sunMesh.rotation.y += cosmoPaused ? 0 : 0.0008;
  sunMaterial.uniforms.time.value = t;
  // Corona billboard — always face camera, tick each layer's time
  coronaGroup.position.copy(sunMesh.position);
  coronaGroup.quaternion.copy(camera.quaternion);
  coronaLayers.forEach(mat => { mat.uniforms.time.value = t; });
  // Parker spiral rotates slowly with the sun
  parkerGroup.rotation.y = sunMesh.rotation.y * 0.18;
  window.parkerPulseMat.uniforms.time.value = t;
  // Interplanetary medium + radiation waves tick
  helioMat.uniforms.time.value    = t;
  waveDiscMat.uniforms.time.value = t;
  // Sporadic solar flare animation — progress 0→1 linear, shader splits into two phases
  if (flareActive) {
    flareTimer += dt;
    const TOTAL = 2.0;
    if (flareTimer >= TOTAL) { flareActive = false; solarFlareMat.uniforms.progress.value = 0; }
    else solarFlareMat.uniforms.progress.value = flareTimer / TOTAL;
  }
  // Depth flare: horizontal ecliptic plane, strand Y-axis tracks camera horizontally
  // so strands appear to shoot toward/away from the viewer
  {
    const _dx = camera.position.x - sunMesh.position.x;
    const _dz = camera.position.z - sunMesh.position.z;
    const _len = Math.sqrt(_dx * _dx + _dz * _dz) || 1;
    const nx = _dx / _len, nz = _dz / _len;
    _dfX.set(-nz, 0, nx);   // perp to camera dir in XZ
    _dfY.set(nx,  0, nz);   // toward camera (horizontal) — strand direction
    _dfM.makeBasis(_dfX, _dfY, _dfZ);
    solarFlareDepthMesh.position.copy(sunMesh.position);
    solarFlareDepthMesh.quaternion.setFromRotationMatrix(_dfM);
  }

  planets.forEach(p => {
    if (!cosmoPaused) p.angle += p.spd * 0.0017;
    p.mesh.position.set(
      p.d * Math.cos(p.angle),
      Math.sin(p.angle * 1.2) * p.inc * p.d * 0.1,
      p.d * Math.sin(p.angle)
    );
    p.mesh.rotation.y += cosmoPaused ? 0 : 0.005;
    // Cloud layer rotates slightly faster than planet
    if (p.mesh.userData.clouds) {
      p.mesh.userData.clouds.rotation.y += cosmoPaused ? 0 : 0.0008;
    }
    p.orbitMesh.material.uniforms.time.value    = t;
    p.orbitMesh.material.uniforms.opacity.value = p.orbitMesh.material.opacity;
  });
  if (window._beltMat && window._beltMat.uniforms) {
    window._beltMat.uniforms.time.value   = t;
    window._beltMat.uniforms.baseOp.value = window._beltMat.opacity;
  }

  // ── Camera — always lerp toward sphTarget, never snap ────────────────────
  const camSpeed = cosmoActive ? 0.016 : 0.10;
  sph.r     += (sphTarget.r     - sph.r)     * camSpeed;
  sph.theta += (sphTarget.theta - sph.theta) * camSpeed;
  sph.phi   += (sphTarget.phi   - sph.phi)   * camSpeed;
  camera.position.set(
    sph.r * Math.sin(sph.phi) * Math.sin(sph.theta),
    sph.r * Math.cos(sph.phi),
    sph.r * Math.sin(sph.phi) * Math.cos(sph.theta)
  );
  // Smoothly lerp the lookAt point
  const lookSpd = cosmoActive ? 0.016 : 0.10;
  window._lookX = (window._lookX || 0) + (sphTarget.lookX - (window._lookX || 0)) * lookSpd;
  window._lookY = (window._lookY || 0) + (sphTarget.lookY - (window._lookY || 0)) * lookSpd;
  window._lookZ = (window._lookZ || 0) + (sphTarget.lookZ - (window._lookZ || 0)) * lookSpd;
  camera.lookAt(window._lookX, window._lookY, window._lookZ);

  if (!cosmoActive && !drag) {
    // Slow orbital drift — pauses only during active drag, resumes instantly on release
    sphTarget.theta += 0.00055;
    // Dual-frequency phi wave: 2.75-min primary + 9.5-min secondary = organic, non-repeating tilt
    const phiDrift = 0.40 + Math.sin(t * 0.038) * 0.20 + Math.sin(t * 0.011) * 0.07;
    // Gently steer sphTarget.phi toward the wave — smooth blend after user drag
    sphTarget.phi  += (phiDrift - sphTarget.phi) * 0.012;
  }
  renderer.render(scene, camera);

  // ── Update planet labels (screen-projected) ─────────────────────────────
  if (window._updatePlanetLabels) window._updatePlanetLabels();

  // ── Post-cosmo: keep hovered label tracking the planet ───────────────────
  if (window._labelsPostCosmo && window._hoveredPlanetIdx >= 0) {
    const idx = window._hoveredPlanetIdx;
    const lEl = labelEls[idx];
    if (lEl && planets[idx]) {
      const W = window.innerWidth, H = window.innerHeight;
      const sc = worldToScreen(planets[idx].mesh.position, camera, W, H);
      if (sc.z < 1) {
        const onRight = sc.x > W * 0.55;
        lEl.style.left      = sc.x + 'px';
        lEl.style.top       = (sc.y - 12) + 'px';
        lEl.style.alignItems = onRight ? 'flex-end' : 'flex-start';
        lEl.style.transform  = onRight ? 'translate(-100%,-100%)' : 'translate(8px,-100%)';
      }
    }
  }
}

updateCamera();
animate();

})();
</script>
