<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Soul Interface — The Origin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Cormorant Garamond',serif;color:#e8e2f4;}
canvas#scene{position:fixed;inset:0;z-index:1;}

:root{
  --gold:rgba(232,215,168,0.85);
  --dim: rgba(200,175,130,0.40);
}

/* ── Begin screen ── */
#begin{
  position:fixed;inset:0;z-index:30;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#000008;
  transition:opacity 1.4s ease;
}
#begin.out{opacity:0;pointer-events:none;}
.begin-eyebrow{
  font-family:'Cinzel',serif;font-size:7px;
  letter-spacing:0.65em;text-transform:uppercase;
  color:rgba(200,175,130,0.28);margin-bottom:30px;
}
.begin-title{
  font-family:'Cinzel',serif;
  font-size:clamp(20px,2.8vw,40px);font-weight:400;
  letter-spacing:0.48em;color:rgba(232,215,168,0.80);
  text-transform:uppercase;margin-bottom:14px;
  text-shadow:0 0 80px rgba(180,140,80,0.22);
}
.begin-sub{
  font-style:italic;font-size:clamp(13px,1.1vw,17px);
  color:rgba(190,160,110,0.38);letter-spacing:0.1em;margin-bottom:64px;
}
.begin-btn{
  font-family:'Cinzel',serif;font-size:8px;letter-spacing:0.52em;
  text-transform:uppercase;color:rgba(200,180,140,0.42);
  border:1px solid rgba(200,175,130,0.16);padding:14px 36px;
  background:none;cursor:pointer;border-radius:1px;
  transition:color 0.6s,border-color 0.6s,text-shadow 0.6s;
}
.begin-btn:hover{
  color:rgba(240,220,170,0.92);border-color:rgba(220,185,110,0.55);
  text-shadow:0 0 28px rgba(220,185,110,0.55);
}

/* ── Phase label ── */
#phase-label{
  position:fixed;top:clamp(30px,4vh,52px);left:clamp(30px,4vw,58px);
  z-index:10;font-family:'Cinzel',serif;font-size:clamp(8px,0.65vw,11px);
  letter-spacing:0.72em;text-transform:uppercase;
  color:rgba(200,180,140,0.45);pointer-events:none;
  opacity:0;transition:opacity 1.8s ease;
}
#phase-label.on{opacity:1;}

/* ── Narration panel ── */
#narration{
  position:fixed;z-index:10;pointer-events:none;
  opacity:0;transition:opacity 2.4s ease;
  max-width:min(500px,38vw);
}
#narration.on{opacity:1;}
#narration.left {top:clamp(58px,7.5vh,94px);left:clamp(30px,4vw,62px);text-align:left;}
#narration.right{top:clamp(58px,7.5vh,94px);right:clamp(30px,4vw,62px);left:auto;text-align:right;}
#narration.center{
  bottom:clamp(110px,13vh,150px);left:50%;transform:translateX(-50%);
  text-align:center;max-width:min(600px,52vw);
}
.nar-line{
  display:block;font-style:italic;
  font-size:clamp(13.5px,1.18vw,18px);line-height:1.78;
  color:rgba(235,220,190,0.0);letter-spacing:0.035em;
  margin-bottom:0.52em;transition:color 2.6s ease;
}
.nar-line.on{color:rgba(235,220,190,0.84);}
.nar-line.bright{
  font-style:normal;font-family:'Cinzel',serif;
  font-size:clamp(10px,0.88vw,13.5px);letter-spacing:0.38em;
  color:rgba(220,195,140,0.0);transition:color 2.8s ease;
}
.nar-line.bright.on{color:rgba(220,195,140,0.72);}

/* ── Continue ── */
#continue-btn{
  position:fixed;bottom:clamp(26px,3.8vh,44px);right:clamp(30px,4vw,56px);
  z-index:12;font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.5em;
  text-transform:uppercase;color:rgba(200,180,140,0.0);
  background:none;border:none;cursor:pointer;pointer-events:none;
  opacity:0;transition:color 0.5s,text-shadow 0.5s,opacity 1.4s ease;
}
#continue-btn.on{opacity:1;pointer-events:all;color:rgba(215,195,155,0.72);}
#continue-btn:hover{color:rgba(250,230,180,0.96);text-shadow:0 0 22px rgba(220,185,110,0.55);}

/* ── Explore hint ── */
#explore-hint{
  position:fixed;bottom:clamp(26px,3.8vh,44px);left:clamp(30px,4vw,56px);
  z-index:10;font-family:'Cinzel',serif;font-size:6.5px;letter-spacing:0.42em;
  text-transform:uppercase;color:rgba(200,180,140,0.0);pointer-events:none;
  transition:color 2s ease;
}
#explore-hint.on{color:rgba(200,180,140,0.20);}

/* ── Phase dots ── */
#phase-dots{
  position:fixed;bottom:clamp(26px,3.8vh,44px);left:50%;transform:translateX(-50%);
  z-index:10;display:flex;gap:9px;pointer-events:none;
  opacity:0;transition:opacity 1.2s ease;
}
#phase-dots.on{opacity:1;}
.dot{width:3.5px;height:3.5px;border-radius:50%;background:rgba(200,175,130,0.16);transition:background 0.8s ease;}
.dot.active{background:rgba(220,195,140,0.60);}

/* ── End card ── */
#end-card{
  position:fixed;inset:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity 3.5s ease;
}
#end-card.on{opacity:1;pointer-events:all;}
.end-line{
  font-style:italic;font-size:clamp(12px,1vw,15px);
  color:rgba(190,160,110,0.45);letter-spacing:0.14em;margin-bottom:24px;
}
.end-title{
  font-family:'Cinzel',serif;font-size:clamp(24px,3vw,46px);font-weight:400;
  letter-spacing:0.5em;color:rgba(235,215,170,0.85);text-transform:uppercase;
  margin-bottom:52px;text-shadow:0 0 80px rgba(180,140,60,0.35);
}
.end-btn{
  font-family:'Cinzel',serif;font-size:8px;letter-spacing:0.52em;
  text-transform:uppercase;color:rgba(200,180,140,0.42);
  border:1px solid rgba(200,175,130,0.16);padding:14px 36px;
  background:none;cursor:pointer;border-radius:1px;text-decoration:none;
  display:inline-block;transition:color 0.6s,border-color 0.6s,text-shadow 0.6s;
}
.end-btn:hover{
  color:rgba(240,220,170,0.92);border-color:rgba(220,185,110,0.55);
  text-shadow:0 0 28px rgba(220,185,110,0.55);
}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="begin">
  <div class="begin-eyebrow">Soul Interface</div>
  <div class="begin-title">The Origin</div>
  <div class="begin-sub">Before you arrived, the universe spent 13.8 billion years preparing</div>
  <button class="begin-btn" onclick="startSequence()">Enter the Origin</button>
</div>

<div id="phase-label"></div>
<div id="narration" class="left"></div>
<div id="explore-hint">Drag &nbsp;·&nbsp; Scroll to zoom</div>
<div id="phase-dots"></div>
<button id="continue-btn" onclick="nextPhase()">Continue &nbsp;→</button>

<div id="end-card">
  <div class="end-line">The cosmos prepared for 13.8 billion years.</div>
  <div class="end-title">Tell Us When</div>
  <a class="end-btn" href="../../../index.html">Enter the Solar System</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Surface any init error directly on screen so it's visible without dev tools
window.onerror = function(msg, src, line) {
  document.body.innerHTML += `<div style="position:fixed;bottom:20px;left:20px;right:20px;background:#1a0000;color:#ff8080;font-family:monospace;font-size:12px;padding:16px;z-index:9999;border:1px solid #660000;border-radius:3px;">JS Error (line ${line}): ${msg}</div>`;
};

// ═══════════════════════════════════════════════════════════════════════════════
// SOUL INTERFACE — COSMOGENESIS SEQUENCE
// ═══════════════════════════════════════════════════════════════════════════════

const canvas   = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000008, 1);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 5000);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── Utilities ─────────────────────────────────────────────────────────────────
const easeIn    = t => t * t * t;
const easeOut   = t => 1 - Math.pow(1-t,3);
const easeInOut = t => t < 0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const clamp     = (v,a,b) => Math.max(a,Math.min(b,v));
const lerp      = (a,b,t) => a+(b-a)*t;

// Background color lerp — huge atmosphere tool
const bgCurrent = { r:0, g:0, b:0.031 };
const bgTarget  = { r:0, g:0, b:0.031 };
function setBgTarget(hex) {
  bgTarget.r = ((hex>>16)&255)/255;
  bgTarget.g = ((hex>>8)&255)/255;
  bgTarget.b = (hex&255)/255;
}
function lerpBg(speed) {
  bgCurrent.r = lerp(bgCurrent.r, bgTarget.r, speed);
  bgCurrent.g = lerp(bgCurrent.g, bgTarget.g, speed);
  bgCurrent.b = lerp(bgCurrent.b, bgTarget.b, speed);
  renderer.setClearColor(
    new THREE.Color(bgCurrent.r, bgCurrent.g, bgCurrent.b), 1
  );
}

// ── Spherical camera ──────────────────────────────────────────────────────────
const sph       = { r:140, theta:0.22, phi:0.45 };
const sphTarget = { r:140, theta:0.22, phi:0.45 };
const RMIN=16, RMAX=400;

function applyCamera() {
  camera.position.set(
    sph.r*Math.sin(sph.phi)*Math.sin(sph.theta),
    sph.r*Math.cos(sph.phi),
    sph.r*Math.sin(sph.phi)*Math.cos(sph.theta)
  );
  camera.lookAt(0,0,0);
}

function lerpCamera(spd) {
  sph.r     += (sphTarget.r-sph.r)*spd;
  sph.theta += (sphTarget.theta-sph.theta)*spd;
  sph.phi   += (sphTarget.phi-sph.phi)*spd;
  applyCamera();
}

// ── Orbit controls ─────────────────────────────────────────────────────────────
let orbitEnabled = false;
let drag=false, prev={x:0,y:0};

canvas.addEventListener('mousedown', e => {
  if(!orbitEnabled)return; drag=true; prev={x:e.clientX,y:e.clientY};
});
window.addEventListener('mouseup', ()=>drag=false);
window.addEventListener('mousemove', e => {
  if(!drag||!orbitEnabled)return;
  sphTarget.theta -= (e.clientX-prev.x)*0.004;
  sphTarget.phi    = clamp(sphTarget.phi+(e.clientY-prev.y)*0.004, 0.06, Math.PI*0.88);
  prev={x:e.clientX,y:e.clientY};
  sph.theta=sphTarget.theta; sph.phi=sphTarget.phi;
});
window.addEventListener('wheel', e=>{
  if(!orbitEnabled)return;
  sphTarget.r=clamp(sphTarget.r+e.deltaY*0.09,RMIN,RMAX);
  sph.r=sphTarget.r;
},{passive:true});
let lastTD=0,lastTch=null;
canvas.addEventListener('touchstart',e=>{
  if(!orbitEnabled)return;
  if(e.touches.length===1){drag=true;lastTch={x:e.touches[0].clientX,y:e.touches[0].clientY};}
  else if(e.touches.length===2){drag=false;lastTD=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
},{passive:true});
canvas.addEventListener('touchmove',e=>{
  if(!orbitEnabled)return;
  if(e.touches.length===1&&drag){
    sphTarget.theta-=(e.touches[0].clientX-lastTch.x)*0.004;
    sphTarget.phi=clamp(sphTarget.phi+(e.touches[0].clientY-lastTch.y)*0.004,0.06,Math.PI*0.88);
    lastTch={x:e.touches[0].clientX,y:e.touches[0].clientY};
    sph.theta=sphTarget.theta;sph.phi=sphTarget.phi;
  }else if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    sphTarget.r=clamp(sphTarget.r-(d-lastTD)*0.09,RMIN,RMAX);
    sph.r=sphTarget.r;lastTD=d;
  }
},{passive:true});
canvas.addEventListener('touchend',()=>drag=false);

// ═══════════════════════════════════════════════════════════════════════════════
// SCENE GEOMETRY
// ═══════════════════════════════════════════════════════════════════════════════

// ── Sprite textures ───────────────────────────────────────────────────────────
function sprite(r,g,b,soft=0.35) {
  const c=document.createElement('canvas');c.width=c.height=64;
  const x=c.getContext('2d');
  const grd=x.createRadialGradient(32,32,0,32,32,32);
  grd.addColorStop(0,`rgba(${r},${g},${b},1)`);
  grd.addColorStop(soft,`rgba(${r},${g},${b},0.7)`);
  grd.addColorStop(1,`rgba(${r},${g},${b},0)`);
  x.fillStyle=grd;x.beginPath();x.arc(32,32,32,0,Math.PI*2);x.fill();
  return new THREE.CanvasTexture(c);
}
const SP_WHITE = sprite(255,255,255);
const SP_BLUE  = sprite(100,180,255);
const SP_CYAN  = sprite(80,220,230);
const SP_RED   = sprite(255,80,40);
const SP_AMBER = sprite(255,180,60);
const SP_VIOLET= sprite(160,80,255);
const SP_GOLD  = sprite(255,210,80);
const SP_TEAL  = sprite(40,220,180);

// ── Star field ────────────────────────────────────────────────────────────────
const starGeo = new THREE.BufferGeometry();
const STAR_N  = 4500;
const starPos = new Float32Array(STAR_N*3);
const starCol = new Float32Array(STAR_N*3);
// Star color palette — blue giants, yellow dwarfs, red giants
const starPal = [[0.9,0.95,1],[1,1,0.88],[1,0.82,0.6],[0.7,0.8,1],[1,0.92,0.92]];
for(let i=0;i<STAR_N;i++){
  const a=Math.random()*Math.PI*2, b=Math.acos(2*Math.random()-1);
  const r=380+Math.random()*200;
  starPos[i*3]=r*Math.sin(b)*Math.cos(a); starPos[i*3+1]=r*Math.sin(b)*Math.sin(a); starPos[i*3+2]=r*Math.cos(b);
  const sc=starPal[Math.floor(Math.random()*starPal.length)];
  starCol[i*3]=sc[0];starCol[i*3+1]=sc[1];starCol[i*3+2]=sc[2];
}
starGeo.setAttribute('position',new THREE.BufferAttribute(starPos,3));
starGeo.setAttribute('color',new THREE.BufferAttribute(starCol,3));
const starMat = new THREE.PointsMaterial({
  size:2.8,sizeAttenuation:true,vertexColors:true,
  transparent:true,opacity:0,depthWrite:false,
  blending:THREE.AdditiveBlending,map:SP_WHITE
});
scene.add(new THREE.Points(starGeo,starMat));

// ── VOID quantum-foam field ───────────────────────────────────────────────────
// Very faint sub-perceptual field — purple-blue, near invisible
const voidGeo = new THREE.BufferGeometry();
const VOID_N  = 2000;
const voidPos = new Float32Array(VOID_N*3);
for(let i=0;i<VOID_N;i++){
  const a=Math.random()*Math.PI*2,b=Math.acos(2*Math.random()-1),r=25+Math.random()*100;
  voidPos[i*3]=r*Math.sin(b)*Math.cos(a);voidPos[i*3+1]=r*Math.sin(b)*Math.sin(a);voidPos[i*3+2]=r*Math.cos(b);
}
voidGeo.setAttribute('position',new THREE.BufferAttribute(voidPos,3));
const voidMat = new THREE.PointsMaterial({
  size:1.4,sizeAttenuation:true,color:0x6020cc,
  transparent:true,opacity:0,depthWrite:false,
  blending:THREE.AdditiveBlending,map:SP_VIOLET
});
const voidField = new THREE.Points(voidGeo,voidMat);
scene.add(voidField);

// Void volumetric sphere — very faint deep purple haze
const voidHaze = new THREE.Mesh(
  new THREE.SphereGeometry(95,32,32),
  new THREE.MeshBasicMaterial({
    color:0x2a0850,transparent:true,opacity:0,
    side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false
  })
);
scene.add(voidHaze);

// ── NEBULA particle cloud ─────────────────────────────────────────────────────
// 12k particles, rich palette from reference images:
// Horsehead: deep pink/red. Crab: electric blue/teal. Cygnus: pure electric blue.
// Infrared: warm gold/yellow-green. Carina: crimson+blue.
const NEB_N = 12000;
const nebGeo  = new THREE.BufferGeometry();
const nebPos0 = new Float32Array(NEB_N*3); // initial positions
const nebCol  = new Float32Array(NEB_N*3);

const nebPalette = [
  [0.92,0.15,0.28], // deep crimson — hydrogen emission
  [0.95,0.32,0.18], // rust orange
  [0.88,0.10,0.40], // hot pink — Ha emission
  [0.10,0.55,0.95], // electric blue — Cygnus Loop
  [0.05,0.30,0.92], // deep cobalt
  [0.08,0.80,0.88], // cyan-teal — ionized gas
  [0.04,0.65,0.72], // teal
  [0.85,0.72,0.12], // warm gold — infrared dust
  [0.70,0.88,0.15], // yellow-green — shocked gas
  [0.48,0.08,0.88], // violet
  [0.25,0.05,0.78], // deep violet
  [0.92,0.55,0.08], // amber — warm dust
];

// 5 lobes — multi-lobe structure like real molecular clouds
const lobeConfig = [
  {ox:55, oy:6,  oz:-28, sp:120, fy:0.14},
  {ox:-75,oy:-12,oz:40,  sp:100, fy:0.12},
  {ox:20, oy:-32,oz:65,  sp:90,  fy:0.16},
  {ox:-35,oy:22, oz:-55, sp:80,  fy:0.13},
  {ox:10, oy:5,  oz:10,  sp:65,  fy:0.10},
];
for(let i=0;i<NEB_N;i++){
  const L  = lobeConfig[i%lobeConfig.length];
  const a  = Math.random()*Math.PI*2;
  const b  = Math.acos(2*Math.random()-1);
  // Dense filamentary structure: particles cluster toward edges of each lobe
  const rn = Math.random();
  const r  = L.sp*(0.2 + 0.8*Math.pow(rn,0.55));
  nebPos0[i*3]  = L.ox + r*Math.sin(b)*Math.cos(a);
  nebPos0[i*3+1]= L.oy + r*Math.sin(b)*Math.sin(a)*L.fy;
  nebPos0[i*3+2]= L.oz + r*Math.cos(b);
  const col = nebPalette[Math.floor(Math.random()*nebPalette.length)];
  nebCol[i*3]=col[0];nebCol[i*3+1]=col[1];nebCol[i*3+2]=col[2];
}
const nebPosCurrent = new Float32Array(nebPos0);
nebGeo.setAttribute('position',new THREE.BufferAttribute(nebPosCurrent,3));
nebGeo.setAttribute('color',new THREE.BufferAttribute(nebCol,3));
const nebSeedArr=new Float32Array(NEB_N);
for(let i=0;i<NEB_N;i++) nebSeedArr[i]=Math.random();
nebGeo.setAttribute('nSeed',new THREE.BufferAttribute(nebSeedArr,1));

const nebMat = new THREE.ShaderMaterial({
  uniforms:{
    time:   {value:0},
    baseOp: {value:0},
    ptSize: {value:2.2},
  },
  transparent:true, depthWrite:false,
  blending:THREE.AdditiveBlending,
  vertexShader:`
    attribute float nSeed;
    uniform float time, ptSize;
    varying vec3 vColor;
    varying float vBright;
    vec3 hsl2rgb(float h,float s,float l){
      vec3 rgb=clamp(abs(mod(h*6.0+vec3(0.0,4.0,2.0),6.0)-3.0)-1.0,0.0,1.0);
      return l+s*(rgb-0.5)*(1.0-abs(2.0*l-1.0));
    }
    void main(){
      float s=nSeed;
      // Three-axis turbulent oscillation — each particle has unique phase & rate
      float t1=time*(0.055+s*0.040)+s*6.2832;
      float t2=time*(0.082+s*0.028)+s*4.1888;
      float t3=time*(0.068+s*0.046)+s*2.0944;
      float amp=3.0+s*9.5;
      vec3 drift=vec3(
        sin(t1)*amp + cos(t2*0.67)*amp*0.38,
        (cos(t2)*0.14 + sin(t3)*0.09)*amp,
        cos(t3)*amp + sin(t1*0.73)*amp*0.38
      );
      vec3 pos=position+drift;
      // Nebula HSL palette — hue drifts slowly, avoids yellow-green
      float hue=fract(s*1.618+time*0.010);
      if(hue<0.20)      hue=hue*0.30;                   // deep crimson 0.00-0.06
      else if(hue<0.45) hue=0.55+(hue-0.20)*0.60;       // electric blue 0.55-0.70
      else if(hue<0.65) hue=0.48+(hue-0.45)*0.35;       // teal/cyan 0.48-0.55
      else if(hue<0.82) hue=0.75+(hue-0.65)*0.59;       // violet/pink 0.75-0.85
      else              hue=0.08+(hue-0.82)*0.67;        // gold/amber 0.08-0.19
      // Per-particle brightness pulse at individual rate
      float pulse=0.45+0.55*sin(time*(0.45+s*0.70)+s*12.566);
      vColor=hsl2rgb(hue,0.84,0.30+s*0.24)*(0.35+pulse*0.85);
      vBright=pulse;
      vec4 mvPos=modelViewMatrix*vec4(pos,1.0);
      float pSize=(ptSize*(0.55+s*1.50))*640.0/-mvPos.z;
      gl_PointSize=clamp(pSize,1.2,32.0);
      gl_Position=projectionMatrix*mvPos;
    }
  `,
  fragmentShader:`
    varying vec3 vColor;
    varying float vBright;
    uniform float baseOp;
    void main(){
      if(baseOp<0.004) discard;
      vec2 c=gl_PointCoord-0.5;
      float d=length(c)*2.0;
      if(d>1.0) discard;

function makeSunTex() {
  const c=document.createElement('canvas');c.width=c.height=512;
  const x=c.getContext('2d');
  // Radial gradient base — SDO golden amber
  const g=x.createRadialGradient(256,256,0,256,256,256);
  g.addColorStop(0,'#fffef8');
  g.addColorStop(0.18,'#ffe890');
  g.addColorStop(0.55,'#ff9c18');
  g.addColorStop(0.82,'#cc4800');
  g.addColorStop(1,'#881800');
  x.fillStyle=g;x.fillRect(0,0,512,512);
  // Magnetic field lines — concentric arcs like SDO images
  x.globalAlpha=0.22;
  for(let i=0;i<120;i++){
    const cx=128+Math.random()*256, cy=128+Math.random()*256;
    const len=20+Math.random()*55;
    const a=Math.random()*Math.PI*2, sweep=Math.PI*(0.3+Math.random()*0.9);
    x.strokeStyle=`rgba(255,${180+Math.floor(Math.random()*60)},60,0.9)`;
    x.lineWidth=0.6+Math.random()*1.2;
    x.beginPath();x.arc(cx,cy,len,a,a+sweep);x.stroke();
  }
  // Bright granulation speckles
  x.globalAlpha=0.15;
  for(let i=0;i<200;i++){
    const bx=Math.random()*512, by=Math.random()*512;
    x.fillStyle='rgba(255,255,200,0.8)';
    x.beginPath();x.arc(bx,by,1+Math.random()*2.5,0,Math.PI*2);x.fill();
  }
  return new THREE.CanvasTexture(c);
}
const sunMesh = new THREE.Mesh(
  new THREE.SphereGeometry(2.5,64,64),
  new THREE.ShaderMaterial({
    uniforms:{tDiffuse:{value:makeSunTex()},warpAmt:{value:0},time:{value:0}},
    vertexShader:`
      uniform float warpAmt,time;
      varying vec2 vUv; varying vec3 vNorm;
      float h31(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.54);}
      float n3(vec3 p){vec3 i=floor(p),f=fract(p),u=f*f*(3.0-2.0*f);
        return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),u.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),u.x),u.y),
                   mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),u.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),u.x),u.y),u.z);}
      float fbm4(vec3 p){float v=0.,a=0.5;for(int i=0;i<4;i++){v+=a*n3(p);p*=2.1;a*=0.5;}return v;}
      void main(){
        vUv=uv; vNorm=normalize(normalMatrix*normal);
        vec3 pos=position;
        if(warpAmt>0.001){
          vec3 wp=position*3.0+vec3(time*0.4,time*0.3,time*0.5);
          float d1=(fbm4(wp)*2.0-1.0)*warpAmt*2.4;
          float d2=(fbm4(wp*1.9+3.7)*2.0-1.0)*warpAmt*1.6;
          pos=position*(1.0+warpAmt*0.60)+normal*(d1+d2);
        }
        gl_Position=projectionMatrix*modelViewMatrix*vec4(pos,1.0);
      }
    `,
    fragmentShader:`
      uniform sampler2D tDiffuse; uniform float warpAmt,time;
      varying vec2 vUv; varying vec3 vNorm;
      void main(){
        vec2 uv=vUv;
        if(warpAmt>0.001){
          uv.x+=sin(vUv.y*20.0+time*2.2)*warpAmt*0.24;
          uv.y+=cos(vUv.x*24.0+time*1.8)*warpAmt*0.20;
          uv=fract(uv);
        }
        vec3 col=texture2D(tDiffuse,uv).rgb;
        float rim=1.0-abs(dot(vNorm,vec3(0.0,0.0,1.0)));
        col+=warpAmt*rim*rim*vec3(1.0,0.50,0.0)*3.0;
        gl_FragColor=vec4(col,1.0);
      }
    `,
  })
);

// ── 2: THE COLLAPSE ──────────────────────────────────────────────────────────
{
  name:'THE COLLAPSE', side:'right', duration:17000,
  bg: 0x06000e,
  narration:[
    'The cloud hears a call it cannot refuse.',
    'Gravity — the weakest force, and the most patient — begins its work.',
    'This is not a catastrophe. This is a calling.',
    'The choice to incarnate is not gentle. It is a falling. A commitment.',
  ],
  enter() {
    this._t=0;
    setBgTarget(0x06000e);
    sphTarget.r=185;sphTarget.phi=0.44;sphTarget.theta=0.60;
    jetMatTop.opacity=0; jetMatBot.opacity=0; waistMat.opacity=0;
    // Reset ignite vortex to initial nebula-scale disk
    const ipos=igniteGeo.attributes.position.array;
    for(let i=0;i<IGNITE_N*3;i++) ipos[i]=ignitePos0[i];
    igniteGeo.attributes.position.needsUpdate=true;
    igniteMat.uniforms.baseOp.value=0;
  },
  fn(pct,dt) {
    this._t=(this._t||0)+dt;
    const pos=nebGeo.attributes.position.array;

    if(pct<0.52) {
      // Gravitational collapse inward
      const sub=pct/0.52;
      const speed=easeIn(sub)*0.30;
      for(let i=0;i<NEB_N;i++){
        const ix=pos[i*3],iy=pos[i*3+1],iz=pos[i*3+2];
        const dist=Math.sqrt(ix*ix+iy*iy+iz*iz)||1;
        pos[i*3]  -=(ix/dist)*speed;
        pos[i*3+1]-=(iy/dist)*speed*0.30;
        pos[i*3+2]-=(iz/dist)*speed;
        // Vortex spin — angular momentum increases as radius shrinks
        const nx=pos[i*3],nz=pos[i*3+2];
        const xzd=Math.sqrt(nx*nx+nz*nz)||0.1;
        const sa=easeIn(sub)*sub*0.016*Math.min(42/(xzd+2),6.0);
        const cs=Math.cos(sa),sn=Math.sin(sa);
        pos[i*3]=cs*nx-sn*nz; pos[i*3+2]=sn*nx+cs*nz;
      }
      nebGeo.attributes.position.needsUpdate=true;
      nebMat.opacity=0.78-sub*0.62;
      nebHazeRed.material.opacity=0.14*(1-sub);
      nebHazeBlue.material.opacity=0.10*(1-sub);

      sphTarget.r=295-easeIn(sub)*225;
      sphTarget.phi=0.44-sub*0.14;
      sphTarget.theta=0.60+sub*0.48;
      starMat.opacity=0.28+sub*0.12;
    } else {
      // Bipolar jets erupt — the L1527 hourglass moment
      const sub=(pct-0.52)/0.48;
      nebMat.opacity=Math.max(0,0.16-sub*0.16);
      jetMatTop.opacity=easeOut(sub)*0.75;
      jetMatBot.opacity=easeOut(sub)*0.68;
      waistMat.opacity=easeOut(sub)*0.45;
      sphTarget.r=70+sub*15;
      sphTarget.phi=0.30+sub*0.10;
      starMat.opacity=0.40+sub*0.12;
      // Ignite vortex particles emerge and spiral inward — nebula becoming core
      const ipos=igniteGeo.attributes.position.array;
      const vSpd=easeOut(sub)*0.42;
      const vSpin=sub*sub*0.024;
      for(let i=0;i<IGNITE_N;i++){
        const ix=ipos[i*3],iy=ipos[i*3+1],iz=ipos[i*3+2];
        const d=Math.sqrt(ix*ix+iy*iy+iz*iz)||0.1;
        ipos[i*3]-=(ix/d)*vSpd; ipos[i*3+1]-=(iy/d)*vSpd*0.35; ipos[i*3+2]-=(iz/d)*vSpd;
        const xzd=Math.sqrt(ipos[i*3]*ipos[i*3]+ipos[i*3+2]*ipos[i*3+2])||0.1;
        const sa=vSpin*Math.min(32/(xzd+1.5),8.0);
        const cs=Math.cos(sa),sn=Math.sin(sa);
        const nx2=cs*ipos[i*3]-sn*ipos[i*3+2]; ipos[i*3+2]=sn*ipos[i*3]+cs*ipos[i*3+2]; ipos[i*3]=nx2;
      }
      igniteGeo.attributes.position.needsUpdate=true;
      igniteMat.uniforms.baseOp.value=easeOut(sub)*0.68;
      igniteMat.uniforms.phase.value=0.0;
    }
  },
  exit(){
    jetMatTop.opacity=0;jetMatBot.opacity=0;waistMat.opacity=0;
    nebMat.opacity=0;
  }
},

});

function setDots(idx) {
  PHASES.forEach((_,i)=>{
    const d=document.getElementById(`dot-${i}`);
    if(d) d.classList.toggle('active',i===idx);
  });
}

function showNarration(phase) {
  const el=document.getElementById('narration');
  el.className='';el.id='narration';
  el.classList.add(phase.side);
  el.style.opacity='0';el.innerHTML='';el.classList.remove('on');

  phase.narration.forEach((txt,i)=>{
    const span=document.createElement('span');
    span.className='nar-line'+(i===phase.narration.length-1&&(txt.includes('began')||txt.includes('of it'))?' bright':'');
    span.textContent=txt;
    el.appendChild(span);
  });

  setTimeout(()=>{
    el.classList.add('on');
    const gap=Math.min(5200,Math.max(3000,(phase.duration*0.72)/Math.max(phase.narration.length,1)));
    el.querySelectorAll('.nar-line').forEach((s,i)=>{
      setTimeout(()=>s.classList.add('on'), 1600+i*gap);
    });
  }, 700);
}

function phaseLabel(name) {
  const el=document.getElementById('phase-label');
  el.classList.remove('on');
  setTimeout(()=>{ el.textContent=name; el.classList.add('on'); },1100);
}

function showContinue()  { document.getElementById('continue-btn').classList.add('on'); }
function hideContinue()  { document.getElementById('continue-btn').classList.remove('on'); }
function showHint()      { document.getElementById('explore-hint').classList.add('on'); }
function hideHint()      { document.getElementById('explore-hint').classList.remove('on'); }

function enterPhase(idx) {
  if(idx>=PHASES.length){ endSequence(); return; }

  if(currentPhase>=0 && PHASES[currentPhase].exit) PHASES[currentPhase].exit();

  currentPhase=idx;
  const phase=PHASES[idx];
  phaseStart=performance.now();
  phasePlaying=true;
  orbitEnabled=false;

  hideContinue(); hideHint();
  setDots(idx);
  phaseLabel(phase.name);
  showNarration(phase);
  if(phase.bg!==undefined) setBgTarget(phase.bg);
  if(phase.enter) phase.enter();
}

function onPhaseComplete() {
  phasePlaying=false;
  const phase=PHASES[currentPhase];
  if(phase.autoAdvance){ setTimeout(()=>enterPhase(currentPhase+1),1400); return; }
  orbitEnabled=true;
  showContinue(); showHint();
}

function nextPhase() {
  orbitEnabled=false; hideContinue(); hideHint();
  const narEl=document.getElementById('narration');
  narEl.classList.remove('on');
  setTimeout(()=>enterPhase(currentPhase+1),1600);
}

function endSequence() {
  orbitEnabled=true;
  hideContinue(); hideHint();
  document.getElementById('phase-label').classList.remove('on');
  document.getElementById('narration').classList.remove('on');
  setTimeout(()=>document.getElementById('end-card').classList.add('on'),2200);
}

function startSequence() {
  if(sequenceStarted)return;
  sequenceStarted=true;

  // Set space immediately — stars visible as begin screen fades
  renderer.setClearColor(0x01000f, 1);
  bgCurrent.r=0.004; bgCurrent.g=0; bgCurrent.b=0.059;
  bgTarget.r =0.004; bgTarget.g=0; bgTarget.b=0.059;

  starMat.opacity    = 0.60;
  voidMat.opacity    = 0.16;
  voidHaze.material.opacity = 0.22;

  const b=document.getElementById('begin');
  b.classList.add('out');
  setTimeout(()=>b.style.display='none',1600);
  document.getElementById('phase-dots').classList.add('on');
  setTimeout(()=>enterPhase(0), 800);
}

// ═══════════════════════════════════════════════════════════════════════════════
// RENDER LOOP
// ═══════════════════════════════════════════════════════════════════════════════

let lastTime=performance.now();

function tick() {
  requestAnimationFrame(tick);
  const now=performance.now();
  const dt=(now-lastTime)/1000;
  lastTime=now;

  if(sequenceStarted && phasePlaying && currentPhase>=0) {
    const phase=PHASES[currentPhase];
    const elapsed=now-phaseStart;
    const pct=clamp(elapsed/phase.duration,0,1);
    if(phase.fn) phase.fn(pct,dt);
    if(pct>=1){ phase.fn&&phase.fn(1,dt); phaseStart=null; onPhaseComplete(); }
  }

  // Idle: keep planets orbiting during explore pause
  if(!phasePlaying && currentPhase>=4) orbitPlanets(0.5);

  lerpCamera(orbitEnabled?0.10:0.040);
  lerpBg(0.018);
  nebMat.uniforms.baseOp.value=nebMat.opacity;
  nebMat.uniforms.ptSize.value=nebMat.size;
  nebMat.uniforms.time.value+=dt;
  sunMesh.material.uniforms.time.value+=dt;
  renderer.render(scene,camera);
}

tick();
</script>
