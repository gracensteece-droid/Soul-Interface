<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Collapse Prototype</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
canvas{position:fixed;inset:0}
#info{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  font-family:monospace;font-size:9px;letter-spacing:0.25em;
  color:rgba(200,130,80,0.18);pointer-events:none;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">DRAG · SCROLL TO ZOOM</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
window.onerror = function(msg,src,line){
  document.body.innerHTML += `<div style="position:fixed;bottom:20px;left:20px;right:20px;background:#1a0000;color:#ff8080;font-family:monospace;font-size:12px;padding:16px;z-index:9999;border:1px solid #660000;">JS Error (line ${line}): ${msg}</div>`;
};

const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000200, 1);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, window.innerWidth/window.innerHeight, 0.1, 2000);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

// ── Camera ────────────────────────────────────────────────────────────────────
const sph       = { r:220, theta:0.35, phi:0.50 };
const sphTarget = { r:220, theta:0.35, phi:0.50 };

function applyCamera(){
  camera.position.set(
    sph.r*Math.sin(sph.phi)*Math.sin(sph.theta),
    sph.r*Math.cos(sph.phi),
    sph.r*Math.sin(sph.phi)*Math.cos(sph.theta)
  );
  camera.lookAt(0,0,0);
}

let drag=false, prev={x:0,y:0};
canvas.addEventListener('mousedown', e=>{ drag=true; prev={x:e.clientX,y:e.clientY}; });
window.addEventListener('mouseup', ()=>drag=false);
window.addEventListener('mousemove', e=>{
  if(!drag) return;
  sphTarget.theta -= (e.clientX-prev.x)*0.004;
  sphTarget.phi    = clamp(sphTarget.phi+(e.clientY-prev.y)*0.004, 0.05, Math.PI*0.88);
  prev={x:e.clientX,y:e.clientY};
  sph.theta=sphTarget.theta; sph.phi=sphTarget.phi;
});
window.addEventListener('wheel', e=>{
  sphTarget.r = clamp(sphTarget.r+e.deltaY*0.18, 40, 600);
  sph.r=sphTarget.r;
},{passive:true});

// ── Shared GLSL ───────────────────────────────────────────────────────────────
const HSL = `
  vec3 hsl2rgb(float h,float s,float l){
    vec3 rgb=clamp(abs(mod(h*6.0+vec3(0.0,4.0,2.0),6.0)-3.0)-1.0,0.0,1.0);
    return l+s*(rgb-0.5)*(1.0-abs(2.0*l-1.0));
  }
`;
const REMAP = `
  float remapHue(float h){
    if     (h<0.20) return h*0.30;
    else if(h<0.45) return 0.55+(h-0.20)*0.60;
    else if(h<0.65) return 0.48+(h-0.45)*0.35;
    else if(h<0.82) return 0.75+(h-0.65)*0.59;
    else            return 0.08+(h-0.82)*0.67;
  }
`;

// ── Stars ─────────────────────────────────────────────────────────────────────
{
  const N=3000,geo=new THREE.BufferGeometry();
  const p=new Float32Array(N*3),c=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const a=Math.random()*Math.PI*2,b=Math.acos(2*Math.random()-1),r=600+Math.random()*300;
    p[i*3]=r*Math.sin(b)*Math.cos(a); p[i*3+1]=r*Math.sin(b)*Math.sin(a); p[i*3+2]=r*Math.cos(b);
    c[i*3]=0.9+Math.random()*0.1; c[i*3+1]=0.85+Math.random()*0.15; c[i*3+2]=1.0;
  }
  geo.setAttribute('position',new THREE.BufferAttribute(p,3));
  geo.setAttribute('color',new THREE.BufferAttribute(c,3));
  scene.add(new THREE.Points(geo,new THREE.PointsMaterial({
    size:1.6,sizeAttenuation:true,vertexColors:true,
    transparent:true,opacity:0.30,depthWrite:false,blending:THREE.AdditiveBlending
  })));
}

// ═══════════════════════════════════════════════════════════════════════════════
// LAYER 1 — SPIRAL DRAIN
// ═══════════════════════════════════════════════════════════════════════════════
const NUM_ARMS = 3;
const DRAIN_N  = 20000;
{
  const geo  = new THREE.BufferGeometry();
  const pos  = new Float32Array(DRAIN_N*3);
  const seed = new Float32Array(DRAIN_N);

  for(let i=0;i<DRAIN_N;i++){
    const arm  = i % NUM_ARMS;
    const t    = Math.random();
    const r    = 4 + t*125;
    const spin = r*0.022;
    const base = (arm/NUM_ARMS)*Math.PI*2;
    const u    = Math.random()*0.999+0.0005;
    const g    = Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*Math.random());
    const angle  = base+spin+g*0.14;
    const rFinal = r+g*r*0.06;
    pos[i*3]   = rFinal*Math.cos(angle);
    pos[i*3+1] = g*r*0.018;
    pos[i*3+2] = rFinal*Math.sin(angle);
    seed[i]    = Math.random();
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('nSeed',   new THREE.BufferAttribute(seed,1));

  const mat = new THREE.ShaderMaterial({
    uniforms:{ time:{value:0} },
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    vertexShader: HSL + REMAP + `
      attribute float nSeed;
      uniform float time;
      varying vec3  vColor;
      varying float vAlpha;
      void main(){
        float s=nSeed;
        float initR=length(position.xz);
        float initAngle=atan(position.z,position.x);
        float initY=position.y;

        float cycleSpeed=0.095+s*0.042;
        float loopT=fract(time*cycleSpeed+s);
        float t=pow(loopT,0.80);

        float r=initR*(1.0-pow(t,1.70));
        float winds=2.8+initR*0.060;
        float angle=initAngle+t*winds*6.2832;

        float h=initY*(1.0-t*0.88);

        float turbAmp=(0.4+t*3.2)*(0.8+s*0.4);
        float tv1=time*(1.8+s*1.2)+s*6.2832;
        float tv2=time*(2.5+s*0.8)+s*4.1888;
        vec3 turb=vec3(sin(tv1)*turbAmp,(cos(tv2)*0.22)*turbAmp,cos(tv1)*turbAmp);

        vec3 pos=vec3(r*cos(angle),h,r*sin(angle))+turb*t;

        float heat=pow(t,1.80);
        float coldHue=remapHue(fract(s*1.618+time*0.012));
        float hotHue=0.07+s*0.06;
        float hue=mix(coldHue,hotHue,heat);
        float sat=mix(0.84,0.96,heat);
        float lum=mix(0.28+s*0.18, 0.72, pow(heat,1.5));
        float brightFlare=1.0+pow(t,4.0)*5.0;
        float pulse=0.55+0.45*sin(time*(3.0+s*2.0)+s*6.28);

        float fadeIn =smoothstep(0.0,0.06,loopT);
        float fadeOut=smoothstep(1.0,0.90,loopT);

        vColor=hsl2rgb(hue,sat,lum)*brightFlare*(0.55+pulse*0.55);
        vAlpha=fadeIn*fadeOut*(0.55+heat*0.55);

        vec4 mvPos=modelViewMatrix*vec4(pos,1.0);
        float ptSz=(1.4+(1.0-heat)*s*1.2)*640.0/-mvPos.z;
        gl_PointSize=clamp(ptSz,0.8,10.0);
        gl_Position=projectionMatrix*mvPos;
      }
    `,
    fragmentShader:`
      uniform float gAlpha;
      varying vec3  vColor;
      varying float vAlpha;
      void main(){
        if(vAlpha<0.004) discard;
        vec2  c=gl_PointCoord-0.5;
        float d=length(c)*2.0;
        if(d>1.0) discard;
        float crisp=smoothstep(0.44,0.0,d);
        float core=max(0.0,1.0-d*9.0)*0.6;
        float alpha=(crisp*0.38+core)*(0.50+vAlpha*0.60)*gAlpha;
        if(alpha<0.003) discard;
        gl_FragColor=vec4(vColor,alpha);
      }
    `,
  });
  scene.add(new THREE.Points(geo,mat));
  mat.uniforms.gAlpha={value:1};
  window._drainMat=mat;
}

// ═══════════════════════════════════════════════════════════════════════════════
// LAYER 2 — VIOLENT CLOUD VORTEX
// ═══════════════════════════════════════════════════════════════════════════════
{
  const CVORT_N = 1600;
  const geo  = new THREE.BufferGeometry();
  const pos  = new Float32Array(CVORT_N*3);
  const seed = new Float32Array(CVORT_N);

  for(let i=0;i<CVORT_N;i++){
    const arm  = i % NUM_ARMS;
    const t    = Math.random();
    const r    = 6+t*110;
    const spin = r*0.022;
    const base = (arm/NUM_ARMS)*Math.PI*2;
    const scatter=(Math.random()-0.5)*r*0.50;
    const angle  = base+spin+scatter/Math.max(r,1);
    const rFinal = r+(Math.random()-0.5)*r*0.30;
    pos[i*3]   = rFinal*Math.cos(angle);
    pos[i*3+1] = (Math.random()-0.5)*r*0.10;
    pos[i*3+2] = rFinal*Math.sin(angle);
    seed[i]    = Math.random();
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('nSeed',   new THREE.BufferAttribute(seed,1));

  const mat = new THREE.ShaderMaterial({
    uniforms:{ time:{value:0} },
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    vertexShader: HSL + REMAP + `
      attribute float nSeed;
      uniform float time;
      varying vec3  vColor;
      varying float vAlpha;
      varying vec2  vSeedOff;
      void main(){
        float s=nSeed;
        float initR=length(position.xz);
        float initAngle=atan(position.z,position.x);

        float loopT=fract(time*0.040+s);
        float t=pow(loopT,0.70);
        float r=initR*(1.0-pow(t,2.0));
        float angle=initAngle+t*4.5*6.2832;
        float h=position.y*(1.0-t*0.70);

        float amp=3.0+t*8.0;
        float tv1=time*(0.12+s*0.08)+s*6.2832;
        float tv2=time*(0.18+s*0.06)+s*4.1888;
        vec3 drift=vec3(sin(tv1)*amp+cos(tv2*0.6)*amp*0.4,
                        (cos(tv2)*0.09+sin(tv1)*0.07)*amp,
                        cos(tv1)*amp+sin(tv2*0.7)*amp*0.4);

        float rotA=time*0.32;
        float cr=cos(rotA),sr=sin(rotA);
        vec3 basePos=vec3(r*cos(angle),h,r*sin(angle));
        basePos=vec3(basePos.x*cr-basePos.z*sr,basePos.y,basePos.x*sr+basePos.z*cr);
        vec3 finalPos=basePos+drift*t;

        float heat=pow(t,1.6);
        float coldHue=remapHue(fract(s*0.618+time*0.004));
        float hue=mix(coldHue, 0.07+s*0.04, heat);
        float sat=mix(0.78,0.94,heat);
        float lum=mix(0.14+s*0.10, 0.55, heat);
        float fade=0.5+0.5*sin(time*0.055+s*3.14);
        float pulse=0.40+0.60*sin(time*(0.55+s*0.45)+s*8.37);
        vColor=hsl2rgb(hue,sat,lum)*(0.25+fade*0.55+pulse*0.28)*(1.0+heat*1.5);
        vAlpha=fade*fade*(0.40+pulse*0.30)*smoothstep(1.0,0.85,loopT)*smoothstep(0.0,0.08,loopT);

        vSeedOff=vec2(s*17.31+time*0.045, s*11.73+time*0.030);
        vec4 mvPos=modelViewMatrix*vec4(finalPos,1.0);
        float baseSize=(18.0+s*32.0)*(0.70+fade*0.40)*640.0/-mvPos.z;
        gl_PointSize=clamp(baseSize,3.0,350.0);
        gl_Position=projectionMatrix*mvPos;
      }
    `,
    fragmentShader: HSL + REMAP + `
      varying vec3  vColor;
      varying float vAlpha;
      varying vec2  vSeedOff;
      float h2(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
      float n2(vec2 p){
        vec2 i=floor(p),f=fract(p),u=f*f*(3.0-2.0*f);
        return mix(mix(h2(i),h2(i+vec2(1,0)),u.x),
                   mix(h2(i+vec2(0,1)),h2(i+vec2(1,1)),u.x),u.y);
      }
      float fbm(vec2 p){
        float v=0.0,a=0.5;
        for(int i=0;i<4;i++){v+=a*n2(p);p=p*2.1+vec2(1.3,7.9);a*=0.5;}
        return v;
      }
      void main(){
        vec2  c=gl_PointCoord-0.5;
        float d=length(c);
        if(d>0.52) discard;
        float n=fbm(c*4.2+vSeedOff);
        float edge=d-n*0.30+0.04;
        float shape=smoothstep(0.48,0.06,edge);
        float detail=fbm(c*8.5+vSeedOff*1.9)*0.42+0.58;
        float alpha=shape*detail*vAlpha*0.60;
        if(alpha<0.002) discard;
        gl_FragColor=vec4(vColor*detail,alpha);
      }
    `,
  });
  scene.add(new THREE.Points(geo,mat));
  window._cvortMat=mat;
}

// ═══════════════════════════════════════════════════════════════════════════════
// LAYER 3 — BIPOLAR JETS
// ═══════════════════════════════════════════════════════════════════════════════
const JET_N = 4000;
{
  const makeJet = (side, colA, colB) => {
    const geo  = new THREE.BufferGeometry();
    const pos  = new Float32Array(JET_N*3);
    const seed = new Float32Array(JET_N);
    for(let i=0;i<JET_N;i++){
      const t  = Math.pow(Math.random(),0.65);
      const yR = t*58;
      const spread = t*t*0.30;
      const a  = Math.random()*Math.PI*2;
      pos[i*3]   = Math.cos(a)*yR*spread;
      pos[i*3+1] = side*yR;
      pos[i*3+2] = Math.sin(a)*yR*spread;
      seed[i]    = Math.random();
    }
    geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    geo.setAttribute('nSeed',   new THREE.BufferAttribute(seed,1));

    const mat = new THREE.ShaderMaterial({
      uniforms:{ time:{value:0} },
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
      vertexShader: HSL + `
        attribute float nSeed;
        uniform float time;
        varying vec3  vColor;
        varying float vAlpha;
        void main(){
          float s=nSeed;
          float cycleSpeed=0.32+s*0.40;
          float phase=fract(time*cycleSpeed+s*7.3);
          float reach=phase;
          vec3 pos=position*reach;
          float tv=time*(2.2+s*1.4)+s*6.28;
          float turbR=length(position.xz)*reach*0.14;
          pos.x+=sin(tv)*turbR;
          pos.z+=cos(tv)*turbR;
          vec3 cA=vec3(${colA});
          vec3 cB=vec3(${colB});
          float pulse=0.50+0.50*sin(time*(3.5+s*2.0)+s*6.28);
          vColor=mix(cA,cB,reach)*( 1.8-reach*1.0)*(0.6+pulse*0.5);
          vAlpha=(1.0-reach)*(1.0-reach)*0.88*smoothstep(0.0,0.05,phase);
          vec4 mvPos=modelViewMatrix*vec4(pos,1.0);
          float ptSz=(1.2+s*0.8)*640.0/-mvPos.z;
          gl_PointSize=clamp(ptSz,0.8,8.0);
          gl_Position=projectionMatrix*mvPos;
        }
      `,
      fragmentShader:`
        varying vec3  vColor;
        varying float vAlpha;
        void main(){
          if(vAlpha<0.004) discard;
          vec2 c=gl_PointCoord-0.5;
          float d=length(c)*2.0;
          if(d>1.0) discard;
          float alpha=vAlpha*smoothstep(0.5,0.02,d);
          gl_FragColor=vec4(vColor,alpha);
        }
      `,
    });
    scene.add(new THREE.Points(geo,mat));
    return mat;
  };

  window._jetTopMat = makeJet( 1, '1.0,0.95,0.80', '1.0,0.28,0.06');
  window._jetBotMat = makeJet(-1, '0.85,0.95,1.0',  '0.10,0.45,1.0');
}

// ── Disk waist ────────────────────────────────────────────────────────────────
{
  const N=1800,geo=new THREE.BufferGeometry();
  const p=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const a=Math.random()*Math.PI*2, r=1+Math.random()*12;
    p[i*3]=r*Math.cos(a); p[i*3+1]=(Math.random()-0.5)*0.8; p[i*3+2]=r*Math.sin(a);
  }
  geo.setAttribute('position',new THREE.BufferAttribute(p,3));
  scene.add(new THREE.Points(geo,new THREE.PointsMaterial({
    size:0.4,color:0x552200,sizeAttenuation:true,
    transparent:true,opacity:0.55,depthWrite:false,blending:THREE.AdditiveBlending
  })));
}

// ── Core ──────────────────────────────────────────────────────────────────────
function coreGlow(r,col,op){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,20,20),
    new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op,
      blending:THREE.AdditiveBlending,depthWrite:false}));
  scene.add(m); return m;
}
const coreWhite  = coreGlow(1.2,  0xffffff, 0.0);
const coreAmber  = coreGlow(2.8,  0xff8800, 0.0);
const coreOrange = coreGlow(5.5,  0xff3300, 0.0);
const coreDark   = coreGlow(8.0,  0x220800, 0.0);
const coreLight  = new THREE.PointLight(0xffaa40, 0, 400);
scene.add(coreLight);
let coreT = 0;

// ── Background halos ──────────────────────────────────────────────────────────
function haze(col,r,op){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,20,20),
    new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op,
      side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));
  scene.add(m);
}
haze(0x4a0008, 145, 0.12);
haze(0x1a0400, 120, 0.10);
haze(0x00050a,  95, 0.08);

// ── Render loop ───────────────────────────────────────────────────────────────
let last=performance.now();
function tick(){
  requestAnimationFrame(tick);
  const now=performance.now();
  const dt=(now-last)/1000; last=now;

  window._drainMat.uniforms.time.value  +=dt;
  window._cvortMat.uniforms.time.value  +=dt;
  window._jetTopMat.uniforms.time.value +=dt;
  window._jetBotMat.uniforms.time.value +=dt;

  coreT+=dt;
  const pulse   = Math.pow(Math.max(0, Math.sin(coreT*0.9)),  2.5);
  const bigFlash= Math.pow(Math.max(0, Math.sin(coreT*0.28)), 8.0)*1.4;
  const core    = pulse+bigFlash;
  coreWhite.material.opacity  = core*0.82;
  coreAmber.material.opacity  = core*0.55;
  coreOrange.material.opacity = core*0.35;
  coreDark.material.opacity   = 0.55+core*0.25;
  coreLight.intensity = core*18;

  if(!drag) sphTarget.theta+=0.00055;
  sph.r     +=(sphTarget.r-sph.r)*0.08;
  sph.theta +=(sphTarget.theta-sph.theta)*0.08;
  sph.phi   +=(sphTarget.phi-sph.phi)*0.08;
  applyCamera();
  renderer.render(scene,camera);
}
tick();
</script>
</body>
</html>
