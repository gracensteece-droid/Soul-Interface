<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Jupiter Formation Loop — Sun Pulse</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
canvas{position:fixed;inset:0}
#hud{
  position:fixed; top:14px; left:14px; width:260px; max-height:94vh; overflow:auto;
  background:rgba(10,8,6,0.78); border:1px solid rgba(200,175,135,0.25);
  border-radius:6px; font-family:monospace; color:rgba(230,215,190,0.92);
  font-size:11px; padding:10px 12px; backdrop-filter:blur(4px); z-index:10;
}
#hud .phase{ font-size:13px; letter-spacing:0.05em; margin-bottom:6px; color:#ffd9a0; }
#hud .row{ display:flex; justify-content:space-between; opacity:0.75; margin:3px 0; }
#hud button{
  margin-top:8px; width:100%; padding:6px; background:rgba(140,200,255,0.10);
  border:1px solid rgba(140,200,255,0.35); border-radius:4px; color:rgba(200,225,255,0.95);
  font-family:inherit; font-size:11px; cursor:pointer;
}
#hud button:hover{ background:rgba(140,200,255,0.18); }
#hud .slider-row{ margin-top:10px; }
#hud .slider-row label{ display:flex; justify-content:space-between; opacity:0.85; margin-bottom:2px; }
#hud .slider-row input[type=range]{ width:100%; }
#hud .section{ margin-top:10px; padding-top:8px; border-top:1px solid rgba(200,175,135,0.15); color:#ffd9a0; opacity:0.85; }
#info{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  font-family:monospace;font-size:9px;letter-spacing:0.25em;
  color:rgba(200,175,135,0.16);pointer-events:none;text-align:center;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="phase" id="phaseLabel">disc forming</div>
  <div class="row"><span>T</span><span id="valT">0.0s</span></div>
  <div class="row"><span>pulse radius</span><span id="valPulseR">0</span></div>
  <div class="slider-row">
    <label><span>Jupiter size</span><span id="valJupSize">2.0</span></label>
    <input type="range" id="jupSizeSlider" min="2" max="16" step="0.1" value="2.0"/>
  </div>
  <div class="slider-row">
    <label><span>Grid overscale</span><span id="valGridOverscale">1.07</span></label>
    <input type="range" id="gridOverscaleSlider" min="1.0" max="1.5" step="0.01" value="1.07"/>
  </div>

  <div class="section">FORMATION TIMING</div>
  <div class="slider-row">
    <label><span>Formation duration</span><span id="valFormDur">4.9s</span></label>
    <input type="range" id="formDurSlider" min="1" max="12" step="0.1" value="4.9"/>
  </div>
  <div class="slider-row">
    <label><span>Gather end %</span><span id="valGatherEnd">45</span></label>
    <input type="range" id="gatherEndSlider" min="10" max="100" step="1" value="45"/>
  </div>
  <div class="slider-row">
    <label><span>Collapse start %</span><span id="valCollapseStart">0</span></label>
    <input type="range" id="collapseStartSlider" min="0" max="90" step="1" value="0"/>
  </div>
  <div class="slider-row">
    <label><span>Collapse end %</span><span id="valCollapseEnd">45</span></label>
    <input type="range" id="collapseEndSlider" min="20" max="100" step="1" value="45"/>
  </div>
  <div class="slider-row">
    <label><span>Reveal start (% of collapse)</span><span id="valRevealStart">79</span></label>
    <input type="range" id="revealStartSlider" min="20" max="99" step="1" value="79"/>
  </div>
  <div class="slider-row">
    <label><span>Reveal duration</span><span id="valRevealDur">2.2s</span></label>
    <input type="range" id="revealDurSlider" min="0.3" max="8" step="0.1" value="2.2"/>
  </div>
  <div class="slider-row">
    <label><span>Shake intensity</span><span id="valShake">4.5</span></label>
    <input type="range" id="shakeSlider" min="0" max="12" step="0.1" value="4.5"/>
  </div>


  <button id="restartBtn">RESTART PULSE</button>
</div>
<div id="info">DRAG · SCROLL TO ZOOM<br/>SINGLE-PLANET FORMATION LOOP — sun pulse repeatedly forms Jupiter from the belt</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
window.onerror = function(msg,src,line){
  document.body.innerHTML += `<div style="position:fixed;bottom:20px;left:20px;right:20px;background:#1a0000;color:#ff8080;font-family:monospace;font-size:12px;padding:16px;z-index:9999;border:1px solid #660000;">JS Error (line ${line}): ${msg}</div>`;
};

const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 1);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(44, window.innerWidth/window.innerHeight, 0.1, 3000);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const smoothstep = t => { t = clamp(t,0,1); return t*t*(3-2*t); };
const lerp = (a,b,t) => a+(b-a)*t;

// JS mirror of the GPU turbulence() function (same value-noise field) so the
// Jupiter precursor cluster shakes in the same organic style as the disc.
function hashN3(x,y,z){ const v=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453; return v-Math.floor(v); }
function noiseN3(x,y,z){
  const xi=Math.floor(x), yi=Math.floor(y), zi=Math.floor(z);
  const xf=x-xi, yf=y-yi, zf=z-zi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf), w=zf*zf*(3-2*zf);
  const x00=lerp(hashN3(xi,yi,zi),hashN3(xi+1,yi,zi),u);
  const x10=lerp(hashN3(xi,yi+1,zi),hashN3(xi+1,yi+1,zi),u);
  const x01=lerp(hashN3(xi,yi,zi+1),hashN3(xi+1,yi,zi+1),u);
  const x11=lerp(hashN3(xi,yi+1,zi+1),hashN3(xi+1,yi+1,zi+1),u);
  return lerp(lerp(x00,x10,v), lerp(x01,x11,v), w);
}
function turbulenceJS(px,py,pz,t,out){
  const qx=px*0.05+t*0.55, qy=py*0.05+t*0.42, qz=pz*0.05+t*0.61;
  const bx=noiseN3(qx,qy,qz)-0.5, by=noiseN3(qx+9.2,qy+1.3,qz+4.1)-0.5, bz=noiseN3(qx+2.7,qy+8.4,qz+5.5)-0.5;
  const qx2=qx*2.3+11.0, qy2=qy*2.3+11.0, qz2=qz*2.3+11.0;
  const fx=noiseN3(qx2,qy2,qz2)-0.5, fy=noiseN3(qx2+5.1,qy2+7.7,qz2+2.2)-0.5, fz=noiseN3(qx2+6.6,qy2+3.3,qz2+9.9)-0.5;
  out[0]=bx*0.75+fx*0.45; out[1]=by*0.75+fy*0.45; out[2]=bz*0.75+fz*0.45;
}
const _turbScratch = [0,0,0];

// ── Spherical camera (same rig as the other nebula prototypes) ───────────────
// Matches index.html's own resting solar-system establishing shot (same FOV,
// same sph values) so the sun reads at the same size/prominence it does there.
const sph       = { r:145, theta:0.22, phi:0.40 };
const sphTarget = { r:145, theta:0.22, phi:0.40 };

function applyCamera(){
  camera.position.set(
    sph.r*Math.sin(sph.phi)*Math.sin(sph.theta),
    sph.r*Math.cos(sph.phi),
    sph.r*Math.sin(sph.phi)*Math.cos(sph.theta)
  );
  camera.lookAt(0,0,0);
}

let drag=false, prev={x:0,y:0};
canvas.addEventListener('mousedown', e=>{ drag=true; prev={x:e.clientX,y:e.clientY}; });
window.addEventListener('mouseup', ()=>drag=false);
window.addEventListener('mousemove', e=>{
  if(!drag) return;
  sphTarget.theta -= (e.clientX-prev.x)*0.004;
  sphTarget.phi    = clamp(sphTarget.phi+(e.clientY-prev.y)*0.004, 0.05, Math.PI*0.88);
  prev={x:e.clientX,y:e.clientY};
  sph.theta=sphTarget.theta; sph.phi=sphTarget.phi;
});
window.addEventListener('wheel', e=>{
  sphTarget.r = clamp(sphTarget.r+e.deltaY*0.20, 40, 900);
  sph.r=sphTarget.r;
},{passive:true});

// ── Star field backdrop ───────────────────────────────────────────────────────
function makeDiscTexture(){
  const cv = document.createElement('canvas');
  cv.width = cv.height = 32;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(16,16,0,16,16,16);
  g.addColorStop(0,   'rgba(255,255,255,1)');
  g.addColorStop(0.4, 'rgba(255,255,255,0.9)');
  g.addColorStop(1,   'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,32,32);
  const tex = new THREE.CanvasTexture(cv);
  tex.needsUpdate = true;
  return tex;
}
{
  const N=2500,geo=new THREE.BufferGeometry();
  const p=new Float32Array(N*3),c=new Float32Array(N*3);
  const pal=[[0.88,0.94,1],[1,1,0.88],[0.68,0.80,1],[1,0.82,0.62]];
  for(let i=0;i<N;i++){
    const a=Math.random()*Math.PI*2,b=Math.acos(2*Math.random()-1),r=400+Math.random()*700;
    p[i*3]=r*Math.sin(b)*Math.cos(a); p[i*3+1]=r*Math.sin(b)*Math.sin(a); p[i*3+2]=r*Math.cos(b);
    const sc=pal[Math.floor(Math.random()*pal.length)];
    c[i*3]=sc[0]; c[i*3+1]=sc[1]; c[i*3+2]=sc[2];
  }
  geo.setAttribute('position',new THREE.BufferAttribute(p,3));
  geo.setAttribute('color',new THREE.BufferAttribute(c,3));
  scene.add(new THREE.Points(geo,new THREE.PointsMaterial({
    size:2.0,sizeAttenuation:true,vertexColors:true,
    map:makeDiscTexture(), alphaTest:0.01,
    transparent:true,opacity:0.5,depthWrite:false,blending:THREE.AdditiveBlending
  })));
}

const HSL_GLSL = `
  vec3 hsl2rgb(float h,float s,float l){
    vec3 rgb=clamp(abs(mod(h*6.0+vec3(0.0,4.0,2.0),6.0)-3.0)-1.0,0.0,1.0);
    return l+s*(rgb-0.5)*(1.0-abs(2.0*l-1.0));
  }
`;

// ═══════════════════════════════════════════════════════════════════════════
// PLANET ORBITAL RADII — artistic/compressed spacing, not to real scale.
// Jupiter is the only "live" ring in this test; the rest are drawn faint as
// context, matching the reference image's multi-ring look.
// ═══════════════════════════════════════════════════════════════════════════
const RINGS = [
  { name:'Mercury', r:18  },
  { name:'Venus',   r:26  },
  { name:'Earth',   r:34  },
  { name:'Mars',    r:44  },
  { name:'Jupiter', r:78  },
  { name:'Saturn',  r:118 },
  { name:'Uranus',  r:150 },
  { name:'Neptune', r:180 },
];
const JUPITER_R     = RINGS.find(r=>r.name==='Jupiter').r;
const JUPITER_ANGLE = 0.62;   // fixed angular position on its ring where it forms
let JUPITER_SIZE  = 2.0;
let JUP_GRID_OVERSCALE = 1.07;
let JUP_FORM_DURATION = 4.9; // seconds for formT 0 -> 1 (was a hardcoded const; now tunable)
let GATHER_END      = 0.45;  // formT fraction where angular gather finishes
// COLLAPSE_START used to be 0.19, i.e. a real gap where particles ONLY slid
// angularly along the ring before radial collapse even began — which reads
// as two separate motions (contract along the ring, THEN condense) instead
// of one fluid contraction. Starting collapse at 0 makes angular gather and
// radial collapse run together from the very first hit.
let COLLAPSE_START  = 0.00;  // formT fraction where radial collapse begins
// Collapse used to ramp all the way out to formT=1.0 (the full 4.9s), so the
// visible "snap into a sphere" moment landed well past one pulse cycle
// (~2.35s) and read as happening on the SECOND beam that hit the ring rather
// than the first. COLLAPSE_END bounds the radial collapse to finish within
// the first cycle instead, so it condenses right on the first hit.
let COLLAPSE_END    = 0.45;  // formT fraction where radial collapse fully finishes
let REVEAL_START    = 0.79;  // fraction *of the collapse window* (COLLAPSE_START..COLLAPSE_END) where the solid mesh starts materializing
let REVEAL_DURATION = 2.2;   // seconds the materialize dissolve takes once it starts — independent of formT/FORM_DURATION so it can be slowed down without affecting the particle motion
let SHAKE_INTENSITY = 4.5;


// ── Ring guides — ported verbatim from index.html's real orbit rings (same
// per-planet colors, same dual-torus flicker+halo shimmer shader) instead of
// a plain static line, so a formed planet's orbit reads exactly like it does
// in the real scene. Invisible until that planet has actually formed — the
// grid reveals itself planet by planet rather than being drawn in up front.
// index.html's tube thicknesses (0.042/0.16) were tuned for its compact
// ~6-57 unit orbital scale; scaled by the same ratio to this scene's much
// larger ring radii (18-180) so they read proportionally the same.
const orbitCols = [0x997755,0xddaa44,0x4488cc,0xdd5522,0xddaa66,0xccaa55,0x66aacc,0x4455ee]; // Mercury..Neptune, same as index.html
const orbitOps  = [0.50,    0.62,   0.72,   0.65,   0.55,   0.52,   0.48,   0.50];
const ringMeshes = {};
RINGS.forEach((ring,i)=>{
  const flickerTube = ring.r * 0.0016;
  const haloTube    = ring.r * 0.0062;
  const flickerMat = new THREE.ShaderMaterial({
    uniforms: {
      time:    { value: 0 },
      opacity: { value: 0 }, // starts hidden; ramped up once that planet has formed
      col:     { value: new THREE.Color(orbitCols[i]) },
      speed:   { value: 0.08 + ring.r * 0.0026 },
    },
    transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      varying vec2 vUv;
      uniform float time, opacity, speed;
      uniform vec3 col;
      void main(){
        float a = vUv.x;
        float w1 = sin((a - time * speed) * 6.28318) * 0.5 + 0.5;
        float w2 = sin((a - time * speed * 0.6) * 18.84954 + 1.7) * 0.5 + 0.5;
        float shimmer = w1 * 0.65 + w2 * 0.40;
        float alpha = opacity * shimmer * 1.35;
        if(alpha < 0.004) discard;
        gl_FragColor = vec4(col * alpha, alpha);
      }
    `,
  });
  const flickerMesh = new THREE.Mesh(new THREE.TorusGeometry(ring.r, flickerTube, 8, 300), flickerMat);
  flickerMesh.rotation.x = Math.PI/2;
  scene.add(flickerMesh);

  const haloMat = new THREE.MeshBasicMaterial({
    color: orbitCols[i], transparent:true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite:false,
  });
  const haloMesh = new THREE.Mesh(new THREE.TorusGeometry(ring.r, haloTube, 8, 300), haloMat);
  haloMesh.rotation.x = Math.PI/2;
  scene.add(haloMesh);

  ringMeshes[ring.name] = { flickerMesh, haloMesh, baseOpacity: orbitOps[i] };
});

// ── Protoplanetary dust disc ──────────────────────────────────────────────────
// Matches the "vinyl groove" reference — many tightly-packed thin concentric
// rings close to the sun, diffusing into a sparse unstructured haze further
// out, rather than a smooth spiral-arm spread.
// Three-tier radial distribution instead of one tight band + one thin sparse
// tail: the tight "vinyl groove" bands stay close to the sun as before, but
// a dedicated mid-density tier now fills the gap between Saturn's ring (118)
// and Uranus's (150) — which used to fall in the sparse tail's weakest
// region — plus a looser far tier for context beyond Uranus.
const DISC_N = 42000;
const RING_BAND_COUNT = 20;
const RING_BAND_SPACING = 4.6;
const RING_BAND_START = 14;
function bandRadius(k){ return RING_BAND_START + k*RING_BAND_SPACING; }
const discGeo = new THREE.BufferGeometry();
{
  const pos   = new Float32Array(DISC_N * 3);
  const seeds = new Float32Array(DISC_N);
  for(let i = 0; i < DISC_N; i++){
    const s = Math.random(); seeds[i] = s;
    let gR;
    const tier = Math.random();
    if(tier < 0.55){
      const bandR = bandRadius(Math.floor(Math.random()*RING_BAND_COUNT));
      gR = bandR + (Math.random()-0.5) * (1.1 + bandR*0.01);
    } else if(tier < 0.85){
      gR = 90 + Math.random()*90; // fills the Jupiter/Saturn -> Uranus gap densely
    } else {
      gR = 150 + Math.pow(Math.random(), 0.7) * 160; // sparser context beyond Uranus
    }
    const gTheta = Math.random() * Math.PI * 2;
    pos[i*3]   = gR * Math.cos(gTheta);
    pos[i*3+1] = (Math.random() - 0.5) * (1.5 + gR*0.02);
    pos[i*3+2] = gR * Math.sin(gTheta);
  }
  discGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  discGeo.setAttribute('nSeed',    new THREE.BufferAttribute(seeds, 1));
}
const discMat = new THREE.ShaderMaterial({
  uniforms:{ time:{value:0}, gAlpha:{value:1}, uPulseR:{value:-1000}, uEnvelope:{value:1} },
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader: HSL_GLSL + `
    attribute float nSeed;
    uniform float time, gAlpha, uPulseR, uEnvelope;
    varying vec3  vColor;
    varying float vAlpha;
    float hashN(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
    float noiseN(vec3 p){
      vec3 i=floor(p),f=fract(p),u=f*f*(3.0-2.0*f);
      return mix(mix(mix(hashN(i),hashN(i+vec3(1,0,0)),u.x),mix(hashN(i+vec3(0,1,0)),hashN(i+vec3(1,1,0)),u.x),u.y),
                 mix(mix(hashN(i+vec3(0,0,1)),hashN(i+vec3(1,0,1)),u.x),mix(hashN(i+vec3(0,1,1)),hashN(i+vec3(1,1,1)),u.x),u.y),u.z);
    }
    // Flow-field turbulence — displacement drawn from a smooth, spatially
    // coherent 3D noise field (2 octaves) rather than fixed per-particle sine
    // waves, so neighbouring particles jostle together in drifting eddies
    // instead of each vibrating on its own independent rigid schedule.
    vec3 turbulence(vec3 p, float t){
      vec3 q = p*0.05 + vec3(t*0.55, t*0.42, t*0.61);
      vec3 base = vec3(
        noiseN(q)               - 0.5,
        noiseN(q+vec3(9.2,1.3,4.1))  - 0.5,
        noiseN(q+vec3(2.7,8.4,5.5))  - 0.5
      );
      vec3 q2 = q*2.3 + vec3(11.0);
      vec3 fine = vec3(
        noiseN(q2)              - 0.5,
        noiseN(q2+vec3(5.1,7.7,2.2)) - 0.5,
        noiseN(q2+vec3(6.6,3.3,9.9)) - 0.5
      );
      return base*0.75 + fine*0.45;
    }
    void main(){
      float s = nSeed;
      float radius = length(position.xz);
      float rotT = time * max(0.003, 0.014 - radius * 0.000042);
      float cr = cos(rotT), sr = sin(rotT);
      vec3 rotPos = vec3(
        position.x*cr - position.z*sr,
        position.y,
        position.x*sr + position.z*cr
      );

      // The passing pulse wavefront rattles particles near its current radius —
      // organic flow-field turbulence localized to a shock band, fading once
      // the front has moved on (a stateless function of |radius-uPulseR|).
      // Gated by uEnvelope (same fade the pulse ring itself uses) so this
      // doesn't slam dust right next to the sun with max shake the instant
      // uPulseR resets to ~0 each repeat, while the pulse is still invisibly
      // inside the sun's own radius — that was a real, physical glitch, not
      // just a visual one.
      float distToFront = abs(radius - uPulseR);
      float shakeEnv = exp(-(distToFront*distToFront) / (2.0*10.0*10.0)) * uEnvelope;
      float shakeAmp = shakeEnv * 7.0;
      rotPos += turbulence(rotPos + s*40.0, time) * shakeAmp;

      float cool = step(0.78, fract(s*8.11));
      float hue = mix(mix(0.06,0.11,fract(s*4.3)), mix(0.57,0.65,fract(s*6.1)), cool);
      float lum = 0.62 + fract(s*7.9)*0.36;
      float sat = 0.42 + fract(s*3.1)*0.35;
      vColor = hsl2rgb(hue, sat, lum) * (1.1 + fract(s*2.3)*0.9 + shakeEnv*0.8);
      vAlpha = 0.65 + fract(s*5.7)*0.35;
      vec4 mvPos = modelViewMatrix * vec4(rotPos, 1.0);
      gl_PointSize = clamp((0.7+fract(s*4.2)*1.5)*640.0/-mvPos.z, 0.8, 7.0);
      gl_Position  = projectionMatrix * mvPos;
    }
  `,
  fragmentShader:`
    uniform float gAlpha;
    varying vec3  vColor;
    varying float vAlpha;
    void main(){
      if(gAlpha < 0.004) discard;
      vec2  c = gl_PointCoord - 0.5;
      float d = length(c) * 2.0;
      if(d > 1.0) discard;
      float crisp = smoothstep(0.55, 0.0, d);
      float core  = max(0.0, 1.0 - d*8.0) * 0.72;
      float alpha = (crisp*0.42 + core) * vAlpha * gAlpha;
      if(alpha < 0.003) discard;
      gl_FragColor = vec4(vColor, alpha);
    }
  `
});
scene.add(new THREE.Points(discGeo, discMat));

// ── Sun (verbatim procedural mottled-plasma shader from cosmogenesis, now
// with that same file's rippleWave/crestGlow surface-ripple effect ported in
// too — 5 fixed crests travel across the sphere on a staggered repeating
// cycle, actually displacing the surface (vertex) and glowing brighter along
// the wavefront (fragment), rather than a flat texture animation.
const SUN_R = 5.5;
const sunMat = new THREE.ShaderMaterial({
  uniforms:{ time:{value:0}, rippleStr:{value:1.4} },
  vertexShader:`
    varying vec3 vPos; varying vec3 vNormal;
    uniform float time, rippleStr;
    float rippleWave(vec3 pn, vec3 c, float t, float off){
      float p    = fract(t + off);
      float cosA = clamp(dot(pn, normalize(c)), -1.0, 1.0);
      float ang  = acos(cosA);
      float env  = exp(-ang*1.5) * pow(max(0.0,1.0-p), 0.55);
      return sin(ang*20.0 - p*26.0) * env;
    }
    void main(){
      vec3 pn = normalize(position);
      float rt = time * 0.17;
      float rd = 0.0;
      rd += rippleWave(pn, vec3( 0.82, 0.40, 0.41), rt, 0.00);
      rd += rippleWave(pn, vec3(-0.65, 0.72, 0.25), rt, 0.20);
      rd += rippleWave(pn, vec3( 0.15,-0.88, 0.45), rt, 0.40);
      rd += rippleWave(pn, vec3(-0.50,-0.30, 0.81), rt, 0.60);
      rd += rippleWave(pn, vec3( 0.30, 0.85,-0.43), rt, 0.80);

        rg += crestGlow(rpn, vec3(-0.50,-0.30, 0.81), rt, 0.60);
        rg += crestGlow(rpn, vec3( 0.30, 0.85,-0.43), rt, 0.80);

const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(SUN_R,64,64), sunMat);

// ── Sun ripple — a bright ring flash that expands out from the sun's surface

  uniforms:{ rippleR:{value:0}, rippleAlpha:{value:0} },
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide,

    varying vec3 vPos;
    void main(){ vPos = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }
  `,
  fragmentShader:`
    uniform float rippleR, rippleAlpha;
    varying vec3 vPos;
    void main(){

      // the mesh's rotation.x=-90° only rotates it into the world's flat
      // orbital plane, it doesn't change what's authored in local space.
      float r = length(vPos.xy);
      float d = abs(r - rippleR);

      // needs to visually pop against the disc's tightly-packed bands
      // (whose radii it will often coincide with), not blend into them.
      float ring = 1.0 - smoothstep(0.0, 7.0, d);

// ═══════════════════════════════════════════════════════════════════════════
// PULSE — a traveling wavefront, expanding outward from the sun as a ring of
// flickering/sparking particles (not a smooth solid band), all the way out
// to whichever planet is currently forming. The FIRST time it crosses that
// planet's ring, formation triggers — but unlike a one-shot, it then keeps
// repeating on a steady beat for as long as that planet is still forming, so
// every single pulse (not just the first) is a full-strength wave that
// actually shakes the accreting particles — there's no separate "lesser"
// pulse anymore.
// ═══════════════════════════════════════════════════════════════════════════
// The pulse MUST repeat on an exact integer multiple of the sun's own ripple
// period (stagger/rate, matching the rt=time*0.17 / off=i*0.2 constants in
// sunMat above), or each launch drifts to a different phase of the sun's
// ripple cycle — some land on a crest and read as synced, others land
// mid-ripple and read as a skipped/late beat. This was the actual root cause
// of the recurring "it still happens" skip — not a rendering pop. 2x the
// ripple period (~2.35s) keeps these as full-strength waves (slower than the
// light-twinkle ripple itself) while staying phase-locked to it.
const SUN_RIPPLE_RATE = 0.17, SUN_RIPPLE_STAGGER = 0.2;

{
  const dummyPos = new Float32Array(PULSE_N*3); // required 'position' attribute; real position is computed in the vertex shader from the attributes below
  const ang  = new Float32Array(PULSE_N);
  const rJit = new Float32Array(PULSE_N);
  const yJit = new Float32Array(PULSE_N);
  const seed = new Float32Array(PULSE_N);
  for(let i=0;i<PULSE_N;i++){
    ang[i]  = Math.random()*Math.PI*2;
    rJit[i] = (Math.random()-0.5)*6.0;
    yJit[i] = (Math.random()-0.5)*2.2;
    seed[i] = Math.random();
  }
  pulseGeo.setAttribute('position', new THREE.BufferAttribute(dummyPos,3));
  pulseGeo.setAttribute('aAngle', new THREE.BufferAttribute(ang,1));
  pulseGeo.setAttribute('aRJit',  new THREE.BufferAttribute(rJit,1));
  pulseGeo.setAttribute('aYJit',  new THREE.BufferAttribute(yJit,1));
  pulseGeo.setAttribute('aSeed',  new THREE.BufferAttribute(seed,1));
}
const pulseMat = new THREE.ShaderMaterial({
  uniforms:{ uPulseR:{value:0}, time:{value:0}, uEnvelope:{value:0} },
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    attribute float aAngle, aRJit, aYJit, aSeed;
    uniform float uPulseR, time;

    float hash1(float n){ return fract(sin(n)*43758.5453); }
    void main(){

      float flashB = hash1(floor(time*13.0 + aSeed*53.0) + 31.7);

    }
  `,
  fragmentShader:`
    uniform float uEnvelope;
    varying float vFlicker;
    void main(){

      float d = length(c)*2.0;

      float core  = smoothstep(0.6,0.0,d);
      float alpha = core * vFlicker * uEnvelope;
      if(alpha<0.01) discard;

});
const pulseMesh = new THREE.Points(pulseGeo, pulseMat);
scene.add(pulseMesh);


let pulseCycle = 0; // increments each time the pulse restarts

// ═══════════════════════════════════════════════════════════════════════════
// SEQUENCER — planets form strictly in the order they were actually measured
// to have formed (Jupiter, then Saturn, then Uranus — the giants formed
// earliest, in roughly that order, well before the rocky inner planets).
// Each planet gets its own dedicated pulse burst: the wavefront only travels
// toward the CURRENT target's ring, and the next planet's burst only launches
// once the current one has fully formed (plus a short hold beat) — a true
// one-at-a-time chain rather than one continuous wave racing past every ring
// at once (which let formation windows overlap and blurred the ordering).
// ═══════════════════════════════════════════════════════════════════════════
let pulseLegStartT = 0;       // T at which the current formation cycle's pulse started traveling from the sun
let seqAdvanceAt = null;      // T at which to begin the hold-then-reset — set once Jupiter finishes forming
// The actual reset (pulseLegStartT jump + re-scattering the dust) must NOT
// happen at the arbitrary instant seqAdvanceAt is reached — that instant
// lands in the middle of whatever pulse is currently mid-flight, snapping it
// back to r=0 and immediately relaunching a new one (and resetting the
// sun-flash the same way), which reads as "it repeats right after it just
// pulsed." Instead we wait for the CURRENT pulse cycle to actually finish its
// natural lap first — pendingLegBoundary is that next natural cycle-restart
// timestamp, computed once seqAdvanceAt is reached, and the reset only
// happens once T reaches it.
let pendingLegBoundary = null;
const HOLD_DURATION = 2.0;    // pause after Jupiter finishes forming, fully formed, before it dissolves back to dust and the loop restarts

// ═══════════════════════════════════════════════════════════════════════════
// JUPITER — accretes from a full ring of dust at its orbital radius, not a
// localized clump. Formation has two stages: particles first gather angularly
// along the ring toward the formation point (from whichever direction is
// shorter), then collapse radially inward into the planet.
// ═══════════════════════════════════════════════════════════════════════════
const JUP_N = 2200;
const jupTargetPos = new THREE.Vector3(
  JUPITER_R*Math.cos(JUPITER_ANGLE), 0, JUPITER_R*Math.sin(JUPITER_ANGLE)
);
const jupGeo = new THREE.BufferGeometry();
const jupStartAngle = new Float32Array(JUP_N);
const jupStartR     = new Float32Array(JUP_N);
const jupStartY     = new Float32Array(JUP_N);
const jupTarget     = new Float32Array(JUP_N*3);
const jupUnit       = new Float32Array(JUP_N*3); // fibonacci-sphere unit vectors, reused by applyJupiterSize()
const jupSeed       = new Float32Array(JUP_N);
{
  const pos = new Float32Array(JUP_N*3);
  for(let i=0;i<JUP_N;i++){
    // Scattered start: the FULL ring at Jupiter's radius, all the way around.
    jupStartAngle[i] = Math.random()*Math.PI*2;
    jupStartR[i]     = JUPITER_R + (Math.random()-0.5)*7;
    jupStartY[i]     = (Math.random()-0.5)*2.2;

    // Formation target: fibonacci sphere surface around the fixed ring point.
    // Overscaled slightly vs. the solid mesh's true radius (JUP_GRID_OVERSCALE)
    // because a point-cloud sphere reads visually smaller than a solid one —
    // sprite density thins out toward the silhouette edge — so without this
    // the solid mesh appears to "pop out beyond" the grid once it fades in.
    // Unit vectors are stored so applyJupiterSize() can recompute jupTarget
    // live when the size/overscale sliders move.
    const gi = i + 0.5;
    const phi = Math.acos(1 - 2*gi/JUP_N);
    const theta = Math.PI * (1+Math.sqrt(5)) * gi;
    const tx = Math.sin(phi)*Math.cos(theta), ty = Math.cos(phi), tz = Math.sin(phi)*Math.sin(theta);
    jupUnit[i*3] = tx; jupUnit[i*3+1] = ty; jupUnit[i*3+2] = tz;

    jupSeed[i] = Math.random();
    pos[i*3]   = jupStartR[i]*Math.cos(jupStartAngle[i]);
    pos[i*3+1] = jupStartY[i];
    pos[i*3+2] = jupStartR[i]*Math.sin(jupStartAngle[i]);
  }
  jupGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  jupGeo.setAttribute('nSeed',    new THREE.BufferAttribute(jupSeed,1));
}
function lerpAngleShortest(a,b,t){
  let d = (b-a) % (Math.PI*2);
  if(d > Math.PI) d -= Math.PI*2;
  if(d < -Math.PI) d += Math.PI*2;
  return a + d*t;
}
const jupMat = new THREE.ShaderMaterial({
  uniforms:{ formT:{value:0}, revealT:{value:0} },
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader: HSL_GLSL + `
    attribute float nSeed;
    uniform float formT, revealT;
    varying vec3  vColor;
    varying float vAlpha;
    void main(){
      float s = nSeed;
      vec3 dustCol   = hsl2rgb(mix(0.09,0.13,fract(s*4.3)), 0.4, 0.65);
      vec3 jupColBand= hsl2rgb(mix(0.09,0.11,fract(s*8.1)), 0.32, mix(0.55,0.85,step(0.5,fract(s*6.7))));
      vColor = mix(dustCol, jupColBand, smoothstep(0.5,1.0,formT));
      // Fades out against the solid's own materialize progress (revealT), not
      // raw formT — so the particle swarm stays visible, converging and
      // settling, for as long as the surface is still solidifying.
      vAlpha = mix(0.7, 0.0, smoothstep(0.35,1.0,revealT));
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = clamp((1.4+fract(s*3.0)*1.8)*640.0/-mvPos.z, 0.8, 8.0);

  fragmentShader:`
    varying vec3  vColor;
    varying float vAlpha;
    void main(){

      vec2  c = gl_PointCoord - 0.5;
      float d = length(c) * 2.0;
      if(d > 1.0) discard;
      float alpha = smoothstep(0.55,0.0,d) * vAlpha;
      if(alpha < 0.003) discard;
      gl_FragColor = vec4(vColor, alpha);

const jupPoints = new THREE.Points(jupGeo, jupMat);
scene.add(jupPoints);

// Solid planet mesh — index.html's ACTUAL in-scene Jupiter material

rimB.position.set(80, -40, 100);

function setAniso(tex){ tex.anisotropy = 16; return tex; }

const jupSolidGroup = new THREE.Group();
jupSolidGroup.position.copy(jupTargetPos);

// Recomputes everything that depends on JUPITER_SIZE / JUP_GRID_OVERSCALE —

function applyJupiterSize(){
  jupSolidGroup.scale.setScalar(JUPITER_SIZE); // base sphere radius 1 -> JUPITER_SIZE

// renders nothing) until the async texture load triggers a recompile.
const jupPlaceholderTex = new THREE.DataTexture(new Uint8Array([255,255,255,255]), 1, 1, THREE.RGBAFormat);
jupPlaceholderTex.needsUpdate = true;
const jupSolidMat = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  map: jupPlaceholderTex,
  emissive: new THREE.Color(0x201008), emissiveIntensity: 0.04,
  roughness: 0.50, metalness: 0.02, bumpScale: 0.8,
  transparent:true, opacity:1,

// Materialize dissolve: the texture solidifies across the sphere in an
// organic, flowing blob pattern (fbm noise field animated over time) with a
// warm molten edge glow riding the growing boundary, instead of a flat
// opacity fade. uReveal/uTime are pushed in from tick() each frame.
//
// Living surface: the UV used for both the color map and bump map is drifted
// in the vertex shader by a zonal-jet flow field — different latitude bands
// scroll horizontally at different speeds, plus a slow turbulent swirl — so
// the texture itself is never static, before or after formation.
let jupiterShaderRef = null;
jupSolidMat.onBeforeCompile = (shader) => {

    uniform float uTime;
    float vjhash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    float vjnoise(vec2 p){
      vec2 i=floor(p), f=fract(p);
      float a=vjhash(i), b=vjhash(i+vec2(1.0,0.0)), c=vjhash(i+vec2(0.0,1.0)), d=vjhash(i+vec2(1.0,1.0));

    `#include <uv_vertex>
    {

      // UV drift spins infinitely fast right at the pole singularity (u wraps
      // a full turn over zero physical distance), reading as a spiral pinch.
      float poleDamp = cos(lat*3.14159265);
      float jet = sin(lat*22.0)*0.5 + 0.5;
      // Oscillates back and forth instead of drifting forever in one
      // direction — an unbounded drift eventually wraps the texture across
      // its own non-seamless edge (the real photo doesn't tile), showing up
      // as a hard seam. Staying within a small bounded range never reaches it.
      float driftX = sin(uTime*mix(0.35,0.55,jet) + lat*30.0) * mix(0.014,0.022,jet) * poleDamp;

      float sparkleFlicker = jnoise(vUv*41.0 + vec2(uTime*2.6, -uTime*1.9));
      float sparkle = step(0.986, sparkleField) * step(0.55, sparkleFlicker) * notYetSolid;
      diffuseColor.rgb += sparkle * vec3(1.7,1.3,0.8) * 2.2;
      diffuseColor.a = max(diffuseColor.a, sparkle * 0.85);
    }`
  );
};
const jupSolidMesh = new THREE.Mesh(new THREE.SphereGeometry(1,64,64), jupSolidMat);
jupSolidMesh.frustumCulled = false; // group scale + async texture swap was letting this get culled out before ever compiling — cheap to always draw at this scale
jupSolidGroup.add(jupSolidMesh);
{
  const loader = new THREE.TextureLoader();
  loader.load(
    'textures/tex_jupiter.jpg',
    tex => {
      setAniso(tex);
      tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
      jupSolidMat.map = tex; jupSolidMat.bumpMap = tex; jupSolidMat.needsUpdate = true;
    },
    undefined,
    err => {
      document.body.innerHTML += `<div style="position:fixed;bottom:60px;left:20px;right:20px;background:#1a0000;color:#ff8080;font-family:monospace;font-size:12px;padding:16px;z-index:9999;border:1px solid #660000;">Jupiter texture FAILED to load: ${err}</div>`;
    }
  );
}
const jupAtmoMat = new THREE.ShaderMaterial({
  uniforms:{ reveal:{value:0} },
  vertexShader:`varying vec3 vN; void main(){ vN=normalize(normalMatrix*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`varying vec3 vN; uniform float reveal;
    void main(){ float i=pow(0.65-dot(vN,vec3(0,0,1.0)),3.0); gl_FragColor=vec4(1.0,0.82,0.55,clamp(i,0.0,1.0)*0.45*reveal); }`,
  blending:THREE.AdditiveBlending, side:THREE.BackSide, transparent:true,
});
const jupAtmoMesh = new THREE.Mesh(new THREE.SphereGeometry(1.03,48,48), jupAtmoMat);
jupAtmoMesh.frustumCulled = false;
jupSolidGroup.add(jupAtmoMesh);

let jupFormTriggerTime = null;
const JUP_ORBIT_SPEED = 0.10; // rad/sec, applied only once formed


// ── Render loop ────────────────────────────────────────────────────────────
const startTime = performance.now();
let paused = false;
const phaseLabel = document.getElementById('phaseLabel');
const valT = document.getElementById('valT');
const valPulseR = document.getElementById('valPulseR');

const jupSizeSlider = document.getElementById('jupSizeSlider');
const valJupSize = document.getElementById('valJupSize');
jupSizeSlider.addEventListener('input', ()=>{
  JUPITER_SIZE = parseFloat(jupSizeSlider.value);
  valJupSize.textContent = JUPITER_SIZE.toFixed(1);
  applyJupiterSize();
});
const gridOverscaleSlider = document.getElementById('gridOverscaleSlider');
const valGridOverscale = document.getElementById('valGridOverscale');
gridOverscaleSlider.addEventListener('input', ()=>{
  JUP_GRID_OVERSCALE = parseFloat(gridOverscaleSlider.value);
  valGridOverscale.textContent = JUP_GRID_OVERSCALE.toFixed(2);
  applyJupiterSize();
});

function wireSlider(id, valId, onChange, fmt){
  const el = document.getElementById(id);
  const out = document.getElementById(valId);
  el.addEventListener('input', ()=>{
    const v = parseFloat(el.value);
    onChange(v);
    out.textContent = fmt ? fmt(v) : v;
  });
}
wireSlider('formDurSlider','valFormDur', v=>{ JUP_FORM_DURATION=v; }, v=>v.toFixed(1)+'s');
wireSlider('gatherEndSlider','valGatherEnd', v=>{ GATHER_END=v/100; }, v=>v.toFixed(0));
wireSlider('collapseStartSlider','valCollapseStart', v=>{ COLLAPSE_START=v/100; }, v=>v.toFixed(0));
wireSlider('collapseEndSlider','valCollapseEnd', v=>{ COLLAPSE_END=v/100; }, v=>v.toFixed(0));
wireSlider('revealStartSlider','valRevealStart', v=>{ REVEAL_START=v/100; }, v=>v.toFixed(0));
wireSlider('revealDurSlider','valRevealDur', v=>{ REVEAL_DURATION=v; }, v=>v.toFixed(1)+'s');
wireSlider('shakeSlider','valShake', v=>{ SHAKE_INTENSITY=v; }, v=>v.toFixed(1));


// Resets Jupiter back to scattered ring dust — shared by the manual restart
// button and the loop's own automatic reset once the post-formation hold
// finishes (see HOLD_DURATION in tick()). Does NOT touch pulseLegStartT or
// cycleStartTime — callers decide those since the button and the auto-loop
// want slightly different behavior around them.
//
// Also resets jupSolidGroup's position back to the fixed formation point —
// the group drifts along its orbit for as long as the planet stays formed
// (see the orbit-motion block in tick()), and without this reset the solid
// mesh would reappear wherever it last drifted to instead of back at the
// point the dust is actually converging on, a real mismatch that's easy to
// miss in the 3-planet sequence (Jupiter's mesh has a full Saturn+Uranus
// lap's worth of near-invisible fade-out to cover the jump) but reads as an
// obvious pop/snap here, where every single repeat is that same loop-back.
function resetJupiter(){
  jupFormTriggerTime = null;
  if(jupiterShaderRef) jupiterShaderRef.uniforms.uReveal.value = 0;
  jupAtmoMat.uniforms.reveal.value = 0;
  jupMat.uniforms.formT.value = 0;
  jupMat.uniforms.revealT.value = 0;
  jupSolidGroup.position.copy(jupTargetPos);
  const pos = jupGeo.attributes.position;
  for(let i=0;i<JUP_N;i++){
    pos.array[i*3]   = jupStartR[i]*Math.cos(jupStartAngle[i]);
    pos.array[i*3+1] = jupStartY[i];
    pos.array[i*3+2] = jupStartR[i]*Math.sin(jupStartAngle[i]);
  }
  pos.needsUpdate = true;
}

document.getElementById('restartBtn').addEventListener('click', ()=>{
  pulseCycle++;
  resetJupiter();
  seqAdvanceAt = null;
  pendingLegBoundary = null;
  cycleStartTime = performance.now();
  pulseLegStartT = 0; // T resets to ~0 alongside cycleStartTime, so the leg start is also ~0
});
let cycleStartTime = startTime;

function tick(){
  requestAnimationFrame(tick);
  const now = performance.now();
  const T = (now - cycleStartTime) / 1000;
  const globalT = (now - startTime) / 1000;

  applyCamera();
  discMat.uniforms.time.value = globalT;
  sunMat.uniforms.time.value  = globalT;
  RINGS.forEach(ring => { ringMeshes[ring.name].flickerMesh.material.uniforms.time.value = globalT; });

  // pr is relative to the CURRENT leg only — it resets to 0 each time a new
  // planet's burst launches (pulseLegStartT) — but within a leg it now
  // REPEATS every PULSE_REPEAT_PERIOD seconds (phase 0->1 maps to 0->legTarget)
  // instead of growing once and stopping, so every single wave is a full
  // trip out to the target, not just the first one that triggers formation.
  // Snaps to full brightness the instant each cycle starts (no fade-in ramp)
  // so it can't read as lagging — only fades on the way out, right before
  // the next cycle begins.
  const legTarget = JUPITER_R;
  const prPhase = ((T - pulseLegStartT) % PULSE_REPEAT_PERIOD) / PULSE_REPEAT_PERIOD;
  const pr = prPhase * legTarget;
  // fadeIn ramps in over distance PAST the sun's own radius (not a fixed
  // time), so the ring only ever becomes visible once it's genuinely cleared
  // the sun's surface — otherwise it starts at r=0, INSIDE the sun's own
  // sphere, and "pops" into view a moment later right as it exits the sun's
  // silhouette, which reads as a visible skip/glitch every single cycle.
  const fadeIn  = smoothstep((pr - SUN_R) / 8.0);
  const fadeOut = 1 - smoothstep((prPhase-0.75)/0.25);
  pulseMat.uniforms.uPulseR.value   = pr;
  pulseMat.uniforms.time.value      = globalT;
  pulseMat.uniforms.uEnvelope.value = fadeIn * fadeOut;
  discMat.uniforms.uPulseR.value = pr;
  discMat.uniforms.uEnvelope.value = fadeIn * fadeOut;

  // Sun ripple flash — fires at the start of every repeat, right as pr
  // resets to ~0, so the sun visibly "sends" each and every wave, not just
  // the first one per leg. Fade duration kept shorter than the repeat period
  // so each flash fully clears before the next one begins. Same fadeIn fix
  // as the pulse ring: it starts at r=0 (inside the sun), so without a
  // radius-based fade-in it's at FULL brightness the instant it resets,
  // which is its own separate "pop" glitch right at the sun's surface.
  const RIPPLE_FADE_DURATION = 1.9;
  const rippleAge = (T - pulseLegStartT) % PULSE_REPEAT_PERIOD;
  const rippleR = rippleAge * (legTarget/PULSE_REPEAT_PERIOD);
  const rippleFadeIn = smoothstep((rippleR - SUN_R) / 8.0);
  sunRippleMat.uniforms.rippleR.value     = rippleR;
  sunRippleMat.uniforms.rippleAlpha.value = rippleFadeIn * Math.max(0, 1 - smoothstep(rippleAge/RIPPLE_FADE_DURATION));

  // Triggers once the first full pulse cycle has completed its trip to the
  // target — equivalent to "pr reached the ring," but checked via elapsed
  // time rather than pr's own value, since pr now wraps via modulo and a
  // frame could otherwise land exactly between "just under target" and
  // "wrapped back to ~0" without ever registering pr >= target in between.
  if(jupFormTriggerTime === null && (T - pulseLegStartT) >= PULSE_REPEAT_PERIOD){
    jupFormTriggerTime = T;
  }

  let phase = 'disc forming';
  if(pr > 2 && pr < JUPITER_R) phase = 'pulse traveling outward';

  // Same shockwave-shake as the main disc shader, computed here in JS since
  // this cluster's position is already CPU-driven for the accretion lerp —
  // fades out as formT commits so the shake hands off into the converge
  // instead of fighting it.
  const formT = jupFormTriggerTime !== null
    ? smoothstep((T - jupFormTriggerTime) / JUP_FORM_DURATION) : 0;
  if(jupFormTriggerTime !== null) phase = formT < 1 ? 'Jupiter accreting' : 'Jupiter settled into orbit';
  if(formT>=1 && seqAdvanceAt===null) seqAdvanceAt = T + HOLD_DURATION;
  if(seqAdvanceAt!==null && pendingLegBoundary===null && T>=seqAdvanceAt){
    const cyclesElapsed = Math.ceil((T - pulseLegStartT) / PULSE_REPEAT_PERIOD);
    pendingLegBoundary = pulseLegStartT + cyclesElapsed * PULSE_REPEAT_PERIOD;
  }
  if(pendingLegBoundary!==null && T>=pendingLegBoundary){
    resetJupiter();
    pulseLegStartT = pendingLegBoundary; // pulse timing stays continuous across the loop-back, no jump/skip
    seqAdvanceAt = null;
    pendingLegBoundary = null;
  }
  // pr now repeats every PULSE_REPEAT_PERIOD, so this same shockwave-shake
  // naturally recurs on every pulse — no separate weaker "heartbeat" needed.
  const distToFront = Math.abs(JUPITER_R - pr);
  const shakeEnv = Math.exp(-(distToFront*distToFront) / (2*10*10));
  // Taper against the COLLAPSE window, not raw formT — otherwise once the
  // shape finishes condensing early (by COLLAPSE_END) it keeps getting
  // jostled at near-full strength for the rest of the long formation
  // duration, since formT itself is still far from 1 at that point. That
  // read as "triggers but doesn't condense fluidly" — the shape snaps into
  // place but then visibly jitters instead of settling.
  const shakeAmp = shakeEnv * SHAKE_INTENSITY * (1 - smoothstep(formT / Math.max(0.001, COLLAPSE_END)));

  // Two-stage accretion: gather angularly along the ring toward the formation
  // point (from whichever direction is shorter), then collapse radially
  // inward into the sphere. The stages overlap slightly for a smooth handoff.
  const gatherT   = smoothstep(formT / Math.max(0.001, GATHER_END));
  const collapseT = smoothstep((formT - COLLAPSE_START) / Math.max(0.001, (COLLAPSE_END - COLLAPSE_START)));
  const posAttr = jupGeo.attributes.position;
  for(let i=0;i<JUP_N;i++){
    const s = jupSeed[i];
    const angle = lerpAngleShortest(jupStartAngle[i], JUPITER_ANGLE, gatherT);
    const ringR = lerp(jupStartR[i], JUPITER_R, gatherT);
    const ringX = ringR*Math.cos(angle);
    const ringY = lerp(jupStartY[i], 0, gatherT);
    const ringZ = ringR*Math.sin(angle);
    const bx = lerp(ringX, jupTarget[i*3],   collapseT);
    const by = lerp(ringY, jupTarget[i*3+1], collapseT);
    const bz = lerp(ringZ, jupTarget[i*3+2], collapseT);
    turbulenceJS(bx+s*40.0, by+s*40.0, bz+s*40.0, globalT, _turbScratch);
    posAttr.array[i*3]   = bx + _turbScratch[0]*shakeAmp;
    posAttr.array[i*3+1] = by + _turbScratch[1]*shakeAmp;
    posAttr.array[i*3+2] = bz + _turbScratch[2]*shakeAmp;
  }
  posAttr.needsUpdate = true;
  jupMat.uniforms.formT.value = formT;

  // The reveal STARTS once collapse is nearly done (anchored to the collapse
  // window, not raw formT, so the solid can never appear before the particle
  // cloud has actually finished converging) — but how long it then takes to
  // fully materialize is its own real-seconds duration (REVEAL_DURATION),
  // independent of JUP_FORM_DURATION, so it can be slowed down on its own.
  const revealStartFormT = COLLAPSE_START + REVEAL_START*(COLLAPSE_END-COLLAPSE_START);
  const revealStartLoopT = revealStartFormT * JUP_FORM_DURATION;
  const tSinceForm = jupFormTriggerTime !== null ? (T - jupFormTriggerTime) : 0;
  const revealT = smoothstep((tSinceForm - revealStartLoopT) / Math.max(0.001, REVEAL_DURATION));
  if(jupiterShaderRef){
    jupiterShaderRef.uniforms.uReveal.value = revealT;
    jupiterShaderRef.uniforms.uTime.value   = globalT;
  }
  jupAtmoMat.uniforms.reveal.value = revealT;
  jupMat.uniforms.revealT.value = revealT;

  // The ring only reveals itself once its planet has actually formed.
  {
    const rm = ringMeshes['Jupiter'];
    const reveal = smoothstep((formT-0.7)/0.3);
    rm.flickerMesh.material.uniforms.opacity.value = rm.baseOpacity * reveal;
    rm.haloMesh.material.opacity = 0.065 * reveal;
  }

  if(formT >= 1){
    const orbitT = T - jupFormTriggerTime - JUP_FORM_DURATION;
    const a = JUPITER_ANGLE + orbitT * JUP_ORBIT_SPEED;
    jupSolidGroup.position.set(JUPITER_R*Math.cos(a), 0, JUPITER_R*Math.sin(a));
    jupSolidMesh.rotation.y += 0.004;
  }

  phaseLabel.textContent = phase;
  valT.textContent = T.toFixed(1)+'s';
  valPulseR.textContent = pr.toFixed(0);

  sph.r     += (sphTarget.r-sph.r)*0.08;
  sph.theta += (sphTarget.theta-sph.theta)*0.08;
  sph.phi   += (sphTarget.phi-sph.phi)*0.08;

  renderer.render(scene, camera);
}
tick();
</script>
