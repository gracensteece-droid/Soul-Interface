<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nebula — Volumetric Raymarch Prototype</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
canvas{position:fixed;inset:0}
#info{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  font-family:monospace;font-size:9px;letter-spacing:0.25em;
  color:rgba(200,175,135,0.16);pointer-events:none;
  text-align:center;
}
#densityPanel{
  position:fixed; top:14px; right:14px; width:280px; max-height:calc(100vh - 28px);
  background:rgba(10,8,6,0.82); border:1px solid rgba(200,175,135,0.25);
  border-radius:6px; font-family:monospace; color:rgba(230,215,190,0.92);
  overflow:hidden; backdrop-filter:blur(4px); z-index:10;
}
#densityPanel.collapsed #densityBody{ display:none; }
#densityToggle{
  width:100%; padding:8px 10px; background:none; border:none; cursor:pointer;
  color:inherit; font-family:inherit; font-size:11px; letter-spacing:0.1em;
  text-align:left; display:flex; justify-content:space-between; align-items:center;
}
#densityBody{ padding:2px 10px 10px; overflow-y:auto; max-height:calc(100vh - 60px); }
.dp-global{ padding:8px 0 10px; border-bottom:1px solid rgba(200,175,135,0.18); margin-bottom:8px; }
.dp-row{ margin:6px 0; }
.dp-row label{ display:flex; justify-content:space-between; font-size:10px; opacity:0.85; margin-bottom:2px; }
.dp-row input[type=range]{ width:100%; accent-color:#c8a887; height:14px; }
.dp-piece{ font-size:10px; padding:5px 0; border-bottom:1px solid rgba(200,175,135,0.08); }
.dp-piece label{ display:flex; justify-content:space-between; opacity:0.75; margin-bottom:1px; }
.dp-val{ opacity:0.55; }
.dp-piece.custom{ background:rgba(140,200,255,0.05); }
.dp-subrow{ display:flex; gap:4px; align-items:center; margin-top:3px; }
.dp-subrow span{ font-size:8px; opacity:0.5; width:10px; }
.dp-subrow input[type=range]{ flex:1; accent-color:#8ac8ff; height:12px; }
.dp-removeBtn{
  background:rgba(255,120,120,0.12); border:1px solid rgba(255,120,120,0.3);
  color:rgba(255,180,180,0.9); font-family:inherit; font-size:9px;
  padding:2px 7px; border-radius:3px; cursor:pointer; margin-top:4px;
}
#addCloudBtn{
  width:100%; margin-top:10px; padding:7px; background:rgba(140,200,255,0.10);
  border:1px solid rgba(140,200,255,0.35); border-radius:4px; color:rgba(200,225,255,0.95);
  font-family:inherit; font-size:11px; letter-spacing:0.05em; cursor:pointer;
}
#addCloudBtn:hover{ background:rgba(140,200,255,0.18); }
.dp-count{ text-align:center; font-size:9px; opacity:0.5; margin-top:6px; }
.dp-count.warn{ color:#ffb060; opacity:0.9; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">DRAG · SCROLL TO ZOOM<br/>VOLUMETRIC RAYMARCH — real 3D density field, not particles</div>

<div id="densityPanel">
  <button id="densityToggle">DENSITY CONTROLS <span id="densityCaret">▾</span></button>
  <div id="densityBody">
    <div class="dp-global">
      <div class="dp-row">
        <label>Global density boost <span class="dp-val" id="valGlobalDensity">0.00</span></label>
        <input type="range" id="ctrlGlobalDensity" min="-0.10" max="0.20" step="0.005" value="0">
      </div>
      <div class="dp-row">
        <label>Global vein strength <span class="dp-val" id="valGlobalErosion">1.00×</span></label>
        <input type="range" id="ctrlGlobalErosion" min="0" max="2" step="0.02" value="1">
      </div>
    </div>
    <div id="perPieceList"></div>
    <button id="addCloudBtn">+ ADD CLOUD</button>
    <div id="pieceCount" class="dp-count"></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
window.onerror = function(msg,src,line){
  document.body.innerHTML += `<div style="position:fixed;bottom:20px;left:20px;right:20px;background:#1a0000;color:#ff8080;font-family:monospace;font-size:12px;padding:16px;z-index:9999;border:1px solid #660000;">JS Error (line ${line}): ${msg}</div>`;
};

const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000308, 1);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 3000);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

// ── Spherical camera (same rig as the other nebula prototypes) ───────────────
const sph       = { r:460, theta:0.30, phi:0.46 };
const sphTarget = { r:460, theta:0.30, phi:0.46 };

function applyCamera(){
  camera.position.set(
    sph.r*Math.sin(sph.phi)*Math.sin(sph.theta),
    sph.r*Math.cos(sph.phi),
    sph.r*Math.sin(sph.phi)*Math.cos(sph.theta)
  );
  camera.lookAt(0,0,0);
}

let drag=false, prev={x:0,y:0};
canvas.addEventListener('mousedown', e=>{ drag=true; prev={x:e.clientX,y:e.clientY}; });
window.addEventListener('mouseup', ()=>drag=false);
window.addEventListener('mousemove', e=>{
  if(!drag) return;
  sphTarget.theta -= (e.clientX-prev.x)*0.004;
  sphTarget.phi    = clamp(sphTarget.phi+(e.clientY-prev.y)*0.004, 0.05, Math.PI*0.88);
  prev={x:e.clientX,y:e.clientY};
  sph.theta=sphTarget.theta; sph.phi=sphTarget.phi;
});
window.addEventListener('wheel', e=>{
  sphTarget.r = clamp(sphTarget.r+e.deltaY*0.20, 110, 1400);
  sph.r=sphTarget.r;
},{passive:true});

// ── Star field (rendered behind — the volume composites over it) ────────────
// PointsMaterial renders square sprites by default unless given a round alpha
// map — this generates a soft circular dot texture on a tiny canvas so stars
// read as points/spheres instead of squares, no external image needed.
function makeDiscTexture(){
  const cv = document.createElement('canvas');
  cv.width = cv.height = 32;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(16,16,0,16,16,16);
  g.addColorStop(0,   'rgba(255,255,255,1)');
  g.addColorStop(0.4, 'rgba(255,255,255,0.9)');
  g.addColorStop(1,   'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,32,32);
  const tex = new THREE.CanvasTexture(cv);
  tex.needsUpdate = true;
  return tex;
}
{
  const N=4500,geo=new THREE.BufferGeometry();
  const p=new Float32Array(N*3),c=new Float32Array(N*3);
  const pal=[[0.88,0.94,1],[1,1,0.88],[0.68,0.80,1],[1,0.82,0.62]];
  for(let i=0;i<N;i++){
    const a=Math.random()*Math.PI*2,b=Math.acos(2*Math.random()-1),r=300+Math.random()*700;
    p[i*3]=r*Math.sin(b)*Math.cos(a); p[i*3+1]=r*Math.sin(b)*Math.sin(a); p[i*3+2]=r*Math.cos(b);
    const sc=pal[Math.floor(Math.random()*pal.length)];
    c[i*3]=sc[0]; c[i*3+1]=sc[1]; c[i*3+2]=sc[2];
  }
  geo.setAttribute('position',new THREE.BufferAttribute(p,3));
  geo.setAttribute('color',new THREE.BufferAttribute(c,3));
  scene.add(new THREE.Points(geo,new THREE.PointsMaterial({
    size:2.2,sizeAttenuation:true,vertexColors:true,
    map:makeDiscTexture(), alphaTest:0.01,
    transparent:true,opacity:0.55,depthWrite:false,blending:THREE.AdditiveBlending
  })));
}

// ═══════════════════════════════════════════════════════════════════════════════
// VOLUMETRIC NEBULA — raymarched density-field "puzzle pieces," one box + one
// draw call each.
//
// A unified single-shader version (one big box, all blobs looped inside one
// raymarch) was tried and reverted — nesting a 16-blob loop inside a 200+ step
// outer loop, each blob check running multi-octave noise, made the shader
// itself too expensive to even compile/run reliably. Went back to this
// separate-draws version instead, but with step counts and noise octaves cut
// hard (see below) so the total overdraw when pieces overlap stays bounded —
// that's what was actually crashing the GPU before, not camera distance itself.
// ═══════════════════════════════════════════════════════════════════════════════
function createNebulaVolume(opts){
  const {
    center, size, seed,
    rimColor, deepColor,
    steps = 36,
    densityThreshold = 0.30,
    densityContrast = 3.6,
    erosionStrength = 0.48,
    name = 'piece',
  } = opts;

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uCameraPos:    { value: new THREE.Vector3() },
      uHalfSize:     { value: size.clone() },
      uCenter:       { value: center.clone() },
      uTime:         { value: 0 },
      uSeed:         { value: seed },
      uRimColor:     { value: rimColor },
      uDeepColor:    { value: deepColor },
      uStepBudget:   { value: steps },
      // Live-tunable from the density control panel — no shader recompile
      // needed when these change, just a uniform update each frame.
      uDensityThreshold: { value: densityThreshold },
      uErosionStrength:  { value: erosionStrength },
    },
    vertexShader: `
      varying vec3 vWorldPos;
      void main(){
        vWorldPos = (modelMatrix * vec4(position,1.0)).xyz;
        gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position,1.0);
      }
    `,
    fragmentShader: `
      uniform vec3  uCameraPos;
      uniform vec3  uHalfSize;
      uniform vec3  uCenter;
      uniform float uTime;
      uniform float uSeed;
      uniform vec3  uRimColor;
      uniform vec3  uDeepColor;
      uniform int   uStepBudget;
      uniform float uDensityThreshold;
      uniform float uErosionStrength;
      varying vec3  vWorldPos;

      float hash31(vec3 p){
        p = fract(p*0.3183099+0.1);
        p *= 17.0;
        return fract(p.x*p.y*p.z*(p.x+p.y+p.z));
      }
      float noise3(vec3 x){
        vec3 i=floor(x), f=fract(x);
        f = f*f*(3.0-2.0*f);
        return mix(
          mix(mix(hash31(i+vec3(0,0,0)),hash31(i+vec3(1,0,0)),f.x),
              mix(hash31(i+vec3(0,1,0)),hash31(i+vec3(1,1,0)),f.x),f.y),
          mix(mix(hash31(i+vec3(0,0,1)),hash31(i+vec3(1,0,1)),f.x),
              mix(hash31(i+vec3(0,1,1)),hash31(i+vec3(1,1,1)),f.x),f.y),
        f.z);
      }
      // Capped at 3 octaves (was 4) — cheaper per sample, barely visible loss
      // at this stylized scale.
      float fbm3(vec3 p, int octaves){
        float v=0.0, a=0.5;
        for(int i=0;i<3;i++){
          if(i>=octaves) break;
          v += a*noise3(p);
          p *= 2.02;
          a *= 0.5;
        }
        return v;
      }

      float density(vec3 p){
        float r = length(p);
        // Widened from (1.0,0.15) — each piece's soft edge now reaches further
        // past its own box before fading to nothing, so neighboring pieces
        // blend into each other instead of leaving black gaps between them.
        // Pulled back in from (1.35,0.05) — that was softening edges too much
        // (read as blur). Still wider than the original (1.0,0.15) so pieces
        // keep blending at seams, just less mushy about it.
        float falloff = smoothstep(1.18, 0.09, r);
        if (falloff <= 0.0) return 0.0;

        vec3 drift = vec3(0.05, 0.012, -0.03) * uTime;
        vec3 q = p * 0.95 + drift + uSeed;

        float macro = fbm3(q*1.5, 3);
        float wisps = fbm3(q*4.2 + 5.0, 3);
        // Extra fine-detail octave + higher frequency — cuts through the
        // smoothness low step-counts otherwise produce.
        float grain = fbm3(q*14.0 + 9.0, 3);
        // Extra base thickness added here (+0.12) specifically to leave room
        // for the vein carving below without losing overall body.
        float shape = macro*0.50 + wisps*0.28 + grain*0.22 + 0.12;

        // Thick, bold veins: low power = wide dark bands (not hairline cracks).
        float erosionRaw = fbm3(q*2.1 + 20.0, 2);
        float veins = pow(1.0 - abs(erosionRaw*2.0 - 1.0), 2.2);
        shape -= veins * uErosionStrength * 0.9;

        return clamp((shape - uDensityThreshold) * ${JSON.stringify(densityContrast)}, 0.0, 1.0) * falloff;
      }

      vec2 boxIntersect(vec3 ro, vec3 rd){
        vec3 inv = 1.0/rd;
        vec3 t0 = (-1.0 - ro)*inv;
        vec3 t1 = ( 1.0 - ro)*inv;
        vec3 tmin = min(t0,t1), tmax = max(t0,t1);
        float tN = max(max(tmin.x,tmin.y),tmin.z);
        float tF = min(min(tmax.x,tmax.y),tmax.z);
        return vec2(tN,tF);
      }

      void main(){
        vec3 ro = (uCameraPos - uCenter) / uHalfSize;
        vec3 rd = normalize((vWorldPos - uCameraPos) / uHalfSize);

        vec2 tb = boxIntersect(ro, rd);
        if (tb.x > tb.y || tb.y < 0.0) { discard; }
        float tStart = max(tb.x, 0.0);
        float tEnd   = tb.y;

        const int MAX_STEPS = ${JSON.stringify(steps)};
        int budget = min(uStepBudget, MAX_STEPS);
        float stepSize = (tEnd - tStart) / float(budget);
        vec3 pos = ro + rd*tStart;

        vec3  accumColor = vec3(0.0);
        float accumAlpha = 0.0;
        float depthAccum = 0.0;

        for (int i=0; i<MAX_STEPS; i++){
          if (i >= budget) break;
          if (accumAlpha > 0.97) break;
          float d = density(pos);
          if (d > 0.003){
            depthAccum += d*stepSize;
            float depthFrac = clamp(depthAccum*2.4, 0.0, 1.0);
            vec3 col = mix(uRimColor, uDeepColor, depthFrac) * 1.5;

            float alpha = d * stepSize * 2.6;
            accumColor += col * alpha * (1.0-accumAlpha);
            accumAlpha += alpha * (1.0-accumAlpha);
          }
          pos += rd*stepSize;
        }

        if (accumAlpha < 0.01) discard;
        gl_FragColor = vec4(accumColor, accumAlpha);
      }
    `,
    side: THREE.BackSide,
    transparent: true,
    depthWrite: false,
  });

  // Unit cube + mesh.scale (instead of baking size into the geometry) so a
  // piece's position/size can be changed live later — e.g. from the "add
  // cloud" panel — just by updating mesh.position/scale + the matching
  // uCenter/uHalfSize uniforms, no geometry rebuild needed.
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), mat);
  mesh.position.copy(center);
  mesh.scale.copy(size);
  scene.add(mesh);
  mat.userData.mesh           = mesh;
  mat.userData.baseSteps      = steps;
  mat.userData.center         = center.clone();
  mat.userData.size           = size.clone();
  mat.userData.charRadius     = (size.x + size.y + size.z) / 3;
  mat.userData.name           = name;
  mat.userData.baseThreshold  = densityThreshold;
  mat.userData.baseErosion    = erosionStrength;

  // Original rim/deep hue+sat+lum, captured so the panel's Hue slider can
  // rotate both colors together (preserving their relative contrast) without
  // needing a shader recompile — uRimColor/uDeepColor are already live
  // uniforms, so this is just a setHSL() per slider tick.
  const rimHSL = {h:0,s:0,l:0}; rimColor.getHSL(rimHSL);
  const deepHSL = {h:0,s:0,l:0}; deepColor.getHSL(deepHSL);
  mat.userData.baseRimHue  = rimHSL.h; mat.userData.rimSat  = rimHSL.s; mat.userData.rimLum  = rimHSL.l;
  mat.userData.baseDeepHue = deepHSL.h; mat.userData.deepSat = deepHSL.s; mat.userData.deepLum = deepHSL.l;
  return mat;
}

const hsl = (h,s,l) => { const c = new THREE.Color(); c.setHSL(h,s,l); return c; };

function warmPalette(seed, opts){
  opts = opts || {};
  const jitter = Math.sin(seed*12.9898) * 0.5 + 0.5;
  const rimHue = (opts.rimHue !== undefined ? opts.rimHue : 0.09) + (jitter-0.5)*0.025;
  const rimLum = (opts.rimLum !== undefined ? opts.rimLum : 0.62) + (jitter-0.5)*0.08;
  const deepHue = ((opts.deepHue !== undefined ? opts.deepHue : 0.98) + (jitter-0.5)*0.02 + 1) % 1;
  const deepLum = (opts.deepLum !== undefined ? opts.deepLum : 0.22) + (jitter-0.5)*0.05;
  return {
    rim:  hsl(rimHue, opts.rimSat !== undefined ? opts.rimSat : 0.90, rimLum),
    deep: hsl(deepHue, opts.deepSat !== undefined ? opts.deepSat : 0.78, deepLum),
  };
}

// Step counts stay cut (was 26-84 originally) — the overlap count is what
// crashed the GPU, not per-piece quality. Density thresholds all lowered
// ~0.03 from the previous pass per Ricky's "much more dense" ask, and the
// 8 pieces cut for safety are back — this is 16 again, testing whether real
// GPU hardware handles it now that per-piece cost is trimmed hard.
const nebulaVolumes = [
  createNebulaVolume({
    center: new THREE.Vector3(0, 0, 0), size: new THREE.Vector3(85, 85, 85),
    seed: 0.0, steps: 50, name:'Core', densityThreshold: 0.27,
    ...(() => { const p = warmPalette(0.0); return { rimColor: p.rim, deepColor: p.deep }; })(),
  }),
  createNebulaVolume({
    center: new THREE.Vector3(110, 10, -15), size: new THREE.Vector3(130, 42, 48),
    seed: 41.3, steps: 36, name:'Filament',
    ...(() => { const p = warmPalette(41.3); return { rimColor: p.rim, deepColor: p.deep }; })(),
    densityThreshold: 0.31, erosionStrength: 0.42,
  }),
  createNebulaVolume({
    center: new THREE.Vector3(-58, -22, 58), size: new THREE.Vector3(72, 78, 62),
    seed: 87.7, steps: 36, name:'Wall',
    ...(() => { const p = warmPalette(87.7, {deepHue:0.99}); return { rimColor: p.rim, deepColor: p.deep }; })(),
    densityThreshold: 0.29, erosionStrength: 0.50,
  }),
  createNebulaVolume({
    center: new THREE.Vector3(18, 55, -75), size: new THREE.Vector3(46, 50, 58),
    seed: 133.9, steps: 30, name:'Top Pocket',
    ...(() => { const p = warmPalette(133.9, {rimHue:0.54, rimLum:0.62, rimSat:0.75, deepHue:0.70, deepLum:0.20}); return { rimColor: p.rim, deepColor: p.deep }; })(),
    densityThreshold: 0.28, erosionStrength: 0.44,
  }),
  createNebulaVolume({
    center: new THREE.Vector3(-65, 32, -55), size: new THREE.Vector3(70, 46, 56),
    seed: 61.2, steps: 30, name:'Bridging Arm',
    ...(() => { const p = warmPalette(61.2, {rimHue:0.03, deepHue:0.85}); return { rimColor: p.rim, deepColor: p.deep }; })(),
    densityThreshold: 0.30, erosionStrength: 0.46,
  }),
  createNebulaVolume({
    center: new THREE.Vector3(22, -18, 32), size: new THREE.Vector3(55, 58, 55),
    seed: 15.6, steps: 32, name:'Hot Knot',
    ...(() => { const p = warmPalette(15.6, {rimLum:0.72, rimSat:0.95}); return { rimColor: p.rim, deepColor: p.deep }; })(),
    densityThreshold: 0.27, erosionStrength: 0.40,
  }),
  createNebulaVolume({
    center: new THREE.Vector3(235, -8, -55), size: new THREE.Vector3(95, 32, 34),
    seed: 202.4, steps: 18, name:'Far Streamer',
    ...(() => { const p = warmPalette(202.4, {rimHue:0.96, deepHue:0.80}); return { rimColor: p.rim, deepColor: p.deep }; })(),
    densityThreshold: 0.33, erosionStrength: 0.40,
  }),
  createNebulaVolume({
    center: new THREE.Vector3(-22, 22, -28), size: new THREE.Vector3(48, 45, 50),
    seed: 300.1, steps: 18, name:'Gap Filler',
    ...(() => { const p = warmPalette(300.1); return { rimColor: p.rim, deepColor: p.deep }; })(),
    densityThreshold: 0.31, erosionStrength: 0.42,
  }),

  // ── Restored: rose/violet reach (was cut for safety) ──
  createNebulaVolume({
    center: new THREE.Vector3(330, 22, -115), size: new THREE.Vector3(105, 52, 60),
    seed: 411.8, steps: 14, name:'Rose Reach 1',
    ...(() => { const p = warmPalette(411.8, {rimHue:0.90, rimSat:0.80, deepHue:0.76, deepLum:0.20}); return { rimColor: p.rim, deepColor: p.deep }; })(),
    densityThreshold: 0.32, erosionStrength: 0.42,
  }),
  createNebulaVolume({
    center: new THREE.Vector3(300, 65, -190), size: new THREE.Vector3(92, 62, 72),
    seed: 455.2, steps: 12, name:'Rose Reach 2',
    ...(() => { const p = warmPalette(455.2, {rimHue:0.88, rimSat:0.75, rimLum:0.55, deepHue:0.74, deepLum:0.18}); return { rimColor: p.rim, deepColor: p.deep }; })(),
    densityThreshold: 0.34, erosionStrength: 0.40,
  }),

  // ── Restored: thick bridge cluster filling the core-to-rose gap ──
  createNebulaVolume({
    center: new THREE.Vector3(85, 58, -95), size: new THREE.Vector3(72, 68, 68),
    seed: 620.3, steps: 26, name:'Bridge A',
    ...(() => { const p = warmPalette(620.3, {rimHue:0.68, rimSat:0.68, rimLum:0.56, deepHue:0.78, deepLum:0.20}); return { rimColor: p.rim, deepColor: p.deep }; })(),
    densityThreshold: 0.30, erosionStrength: 0.42,
  }),
  createNebulaVolume({
    center: new THREE.Vector3(140, 40, -115), size: new THREE.Vector3(65, 62, 64),
    seed: 641.1, steps: 24, name:'Bridge B',
    ...(() => { const p = warmPalette(641.1, {rimHue:0.78, rimSat:0.70, rimLum:0.54, deepHue:0.80, deepLum:0.19}); return { rimColor: p.rim, deepColor: p.deep }; })(),
    densityThreshold: 0.29, erosionStrength: 0.44,
  }),
  createNebulaVolume({
    center: new THREE.Vector3(195, 62, -135), size: new THREE.Vector3(68, 60, 62),
    seed: 664.7, steps: 24, name:'Bridge C',
    ...(() => { const p = warmPalette(664.7, {rimHue:0.86, rimSat:0.75, rimLum:0.52, deepHue:0.79, deepLum:0.19}); return { rimColor: p.rim, deepColor: p.deep }; })(),
    densityThreshold: 0.29, erosionStrength: 0.44,
  }),
  createNebulaVolume({
    center: new THREE.Vector3(120, 25, -150), size: new THREE.Vector3(60, 56, 58),
    seed: 688.4, steps: 22, name:'Bridge D',
    ...(() => { const p = warmPalette(688.4, {rimHue:0.82, rimSat:0.72, rimLum:0.50, deepHue:0.79, deepLum:0.18}); return { rimColor: p.rim, deepColor: p.deep }; })(),
    densityThreshold: 0.30, erosionStrength: 0.42,
  }),

  // ── Restored: distant soft backdrop layer ──
  createNebulaVolume({
    center: new THREE.Vector3(-50, 15, -230), size: new THREE.Vector3(150, 105, 95),
    seed: 512.6, steps: 10, name:'Backdrop A',
    ...(() => { const p = warmPalette(512.6, {rimHue:0.58, rimSat:0.55, rimLum:0.48, deepHue:0.72, deepLum:0.16}); return { rimColor: p.rim, deepColor: p.deep }; })(),
    densityThreshold: 0.37, erosionStrength: 0.38,
  }),
  createNebulaVolume({
    center: new THREE.Vector3(160, -65, -260), size: new THREE.Vector3(125, 95, 85),
    seed: 561.9, steps: 10, name:'Backdrop B',
    ...(() => { const p = warmPalette(561.9, {rimHue:0.60, rimSat:0.50, rimLum:0.44, deepHue:0.70, deepLum:0.15}); return { rimColor: p.rim, deepColor: p.deep }; })(),
    densityThreshold: 0.38, erosionStrength: 0.38,
  }),

  // ── Small, cheap gap-fillers at the specific visible seams between color
  // regions (core↔top pocket, top pocket↔bridge cluster, core↔red patch).
  // Low step counts (8) — these just need to soften a seam, not add detail.
  createNebulaVolume({
    center: new THREE.Vector3(8, 42, -35), size: new THREE.Vector3(40, 40, 42),
    seed: 951.2, steps: 8, name:'Seam Fill 1',
    ...(() => { const p = warmPalette(951.2, {rimHue:0.30, rimSat:0.60, deepHue:0.75}); return { rimColor: p.rim, deepColor: p.deep }; })(),
    densityThreshold: 0.35, erosionStrength: 0.36,
  }),
  createNebulaVolume({
    center: new THREE.Vector3(50, 62, -80), size: new THREE.Vector3(38, 40, 40),
    seed: 972.6, steps: 8, name:'Seam Fill 2',
    ...(() => { const p = warmPalette(972.6, {rimHue:0.60, rimSat:0.55, deepHue:0.74}); return { rimColor: p.rim, deepColor: p.deep }; })(),
    densityThreshold: 0.35, erosionStrength: 0.36,
  }),
  createNebulaVolume({
    center: new THREE.Vector3(-30, 20, -42), size: new THREE.Vector3(38, 38, 38),
    seed: 988.1, steps: 8, name:'Seam Fill 3',
    ...(() => { const p = warmPalette(988.1, {rimHue:0.02, deepHue:0.90}); return { rimColor: p.rim, deepColor: p.deep }; })(),
    densityThreshold: 0.35, erosionStrength: 0.36,
  }),
];

// ── Density control panel — live per-piece + global tuning ───────────────────
// Per-piece threshold is absolute (each slider ranges around that piece's own
// base value); global density/vein sliders apply as an offset/multiplier on
// top of every piece's base at once, so both "blend everything at once" and
// "nudge one piece" are available without touching code.
{
  const toggleBtn = document.getElementById('densityToggle');
  const panel     = document.getElementById('densityPanel');
  const caret     = document.getElementById('densityCaret');
  toggleBtn.addEventListener('click', () => {
    panel.classList.toggle('collapsed');
    caret.textContent = panel.classList.contains('collapsed') ? '▸' : '▾';
  });

  const globalDensityEl = document.getElementById('ctrlGlobalDensity');
  const globalErosionEl = document.getElementById('ctrlGlobalErosion');
  const valGlobalDensity = document.getElementById('valGlobalDensity');
  const valGlobalErosion = document.getElementById('valGlobalErosion');

  function applyAll(){
    const densityOffset = parseFloat(globalDensityEl.value);
    const erosionMul     = parseFloat(globalErosionEl.value);
    valGlobalDensity.textContent = densityOffset.toFixed(3);
    valGlobalErosion.textContent = erosionMul.toFixed(2) + '×';
    for (const mat of nebulaVolumes){
      const perPieceDelta = mat.userData.perPieceDelta || 0;
      mat.uniforms.uDensityThreshold.value = mat.userData.baseThreshold - densityOffset + perPieceDelta;
      mat.uniforms.uErosionStrength.value  = mat.userData.baseErosion * erosionMul;
    }
  }
  globalDensityEl.addEventListener('input', applyAll);
  globalErosionEl.addEventListener('input', applyAll);

  const listEl    = document.getElementById('perPieceList');
  const countEl   = document.getElementById('pieceCount');
  const SAFE_MAX  = 20; // verified-safe ceiling found by direct testing — past
                         // this you're in unverified territory on your hardware

  function updateCount(){
    const n = nebulaVolumes.length;
    countEl.textContent = `${n} clouds`;
    countEl.classList.toggle('warn', n > SAFE_MAX);
    if (n > SAFE_MAX) countEl.textContent += ' — past the verified-safe range, watch for slowdown';
  }

  function addPieceRow(mat, isCustom){
    mat.userData.perPieceDelta = 0;
    const row = document.createElement('div');
    row.className = 'dp-piece' + (isCustom ? ' custom' : '');
    const valId = 'dp-val-' + Math.random().toString(36).slice(2);
    row.innerHTML = `
      <label>${mat.userData.name} <span class="dp-val" id="${valId}">${mat.userData.baseThreshold.toFixed(2)}</span></label>
      <input type="range" class="dp-density" min="${(mat.userData.baseThreshold-0.15).toFixed(3)}" max="${(mat.userData.baseThreshold+0.15).toFixed(3)}" step="0.005" value="${mat.userData.baseThreshold}">
    `;
    const densityInput = row.querySelector('.dp-density');
    const valSpan = row.querySelector('#'+valId);
    densityInput.addEventListener('input', () => {
      const v = parseFloat(densityInput.value);
      mat.userData.perPieceDelta = v - mat.userData.baseThreshold;
      valSpan.textContent = v.toFixed(3);
      applyAll();
    });

    // Hue slider — every piece gets one (not just custom ones). Rotates rim
    // and deep colors together by the same delta, preserving whatever
    // rim/deep contrast that piece was designed with, no rebake needed since
    // uRimColor/uDeepColor are live uniforms.
    const hueSub = document.createElement('div');
    hueSub.className = 'dp-subrow';
    hueSub.innerHTML = `<span>HUE</span><input type="range" class="dp-hue" min="0" max="1" step="0.005" value="${mat.userData.baseRimHue.toFixed(3)}">`;
    const hueInput = hueSub.querySelector('input');
    hueInput.addEventListener('input', () => {
      const v = parseFloat(hueInput.value);
      const delta = v - mat.userData.baseRimHue;
      const newRimHue  = ((v % 1) + 1) % 1;
      const newDeepHue = (((mat.userData.baseDeepHue + delta) % 1) + 1) % 1;
      mat.uniforms.uRimColor.value.setHSL(newRimHue, mat.userData.rimSat, mat.userData.rimLum);
      mat.uniforms.uDeepColor.value.setHSL(newDeepHue, mat.userData.deepSat, mat.userData.deepLum);
    });
    row.appendChild(hueSub);

    if (isCustom){
      // Position (X/Y/Z) + size sliders, and a remove button — only for
      // pieces added through the panel, so the original 19 stay uncluttered.
      const c = mat.userData.center, s = mat.userData.size;
      ['x','y','z'].forEach(axis => {
        const sub = document.createElement('div');
        sub.className = 'dp-subrow';
        sub.innerHTML = `<span>${axis.toUpperCase()}</span><input type="range" min="-300" max="300" step="2" value="${c[axis]}">`;
        const inp = sub.querySelector('input');
        inp.addEventListener('input', () => {
          mat.userData.center[axis] = parseFloat(inp.value);
          mat.userData.mesh.position.copy(mat.userData.center);
          mat.uniforms.uCenter.value.copy(mat.userData.center);
        });
        row.appendChild(sub);
      });
      const sizeSub = document.createElement('div');
      sizeSub.className = 'dp-subrow';
      sizeSub.innerHTML = `<span>SZ</span><input type="range" min="15" max="140" step="2" value="${s.x}">`;
      const sizeInp = sizeSub.querySelector('input');
      sizeInp.addEventListener('input', () => {
        const v = parseFloat(sizeInp.value);
        mat.userData.size.set(v,v,v);
        mat.userData.charRadius = v;
        mat.userData.mesh.scale.copy(mat.userData.size);
        mat.uniforms.uHalfSize.value.copy(mat.userData.size);
      });
      row.appendChild(sizeSub);

      const removeBtn = document.createElement('button');
      removeBtn.className = 'dp-removeBtn';
      removeBtn.textContent = 'REMOVE';
      removeBtn.addEventListener('click', () => {
        scene.remove(mat.userData.mesh);
        mat.userData.mesh.geometry.dispose();
        mat.dispose();
        const idx = nebulaVolumes.indexOf(mat);
        if (idx !== -1) nebulaVolumes.splice(idx, 1);
        row.remove();
        updateCount();
      });
      row.appendChild(removeBtn);
    }

    listEl.appendChild(row);
  }

  nebulaVolumes.forEach(mat => addPieceRow(mat, false));
  updateCount();

  let customCounter = 0;
  document.getElementById('addCloudBtn').addEventListener('click', () => {
    customCounter++;
    // Spawn near the current view center with some jitter, modest default
    // size/cost (steps:20 — similar to the cheaper existing pieces).
    const center = new THREE.Vector3(
      (Math.random()-0.5)*160,
      (Math.random()-0.5)*100,
      (Math.random()-0.5)*120 - 60
    );
    const size = new THREE.Vector3(55,55,55);
    const seed = 2000 + Math.random()*5000;
    const pal = warmPalette(seed);
    const mat = createNebulaVolume({
      center, size, seed, steps: 20, name: 'Custom ' + customCounter,
      rimColor: pal.rim, deepColor: pal.deep,
      densityThreshold: 0.32, erosionStrength: 0.42,
    });
    nebulaVolumes.push(mat);
    addPieceRow(mat, true);
    updateCount();
  });
}

// ── Render loop ───────────────────────────────────────────────────────────────
let last = performance.now();
let simTime = 0;
function tick(){
  requestAnimationFrame(tick);
  const now = performance.now();
  const dt = (now-last)/1000; last = now;
  simTime += dt;

  for (const mat of nebulaVolumes){
    mat.uniforms.uTime.value = simTime;
    mat.uniforms.uCameraPos.value.copy(camera.position);

    const dist  = camera.position.distanceTo(mat.userData.center);
    const ratio = dist / mat.userData.charRadius;
    const lod   = clamp(ratio / 2.2, 0.22, 1.0);
    mat.uniforms.uStepBudget.value = Math.max(6, Math.round(mat.userData.baseSteps * lod));
  }

  if(!drag) sphTarget.theta += 0.00038;
  sph.r     += (sphTarget.r-sph.r)*0.08;
  sph.theta += (sphTarget.theta-sph.theta)*0.08;
  sph.phi   += (sphTarget.phi-sph.phi)*0.08;
  applyCamera();
  renderer.render(scene, camera);
}
tick();
</script>
