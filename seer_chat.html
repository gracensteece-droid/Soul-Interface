<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Soul Interface</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&family=Space+Mono:ital@0;1&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --void: #03020a;
    --deep: #080614;
    --surface: #0f0c1e;
    --maren-primary: #c9a96e;
    --maren-glow: rgba(201,169,110,0.15);
    --arya-primary: #7b9ea8;
    --arya-glow: rgba(123,158,168,0.15);
    --aion-primary: #b8a8d4;
    --aion-glow: rgba(184,168,212,0.15);
    --text-primary: #e8e4f0;
    --text-secondary: #9890a8;
    --text-dim: #524d62;
    --active-primary: #c9a96e;
    --active-glow: rgba(201,169,110,0.15);
    --ease: cubic-bezier(0.22,0.61,0.36,1);
  }

  body {
    background: var(--void);
    color: var(--text-primary);
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    line-height: 1.75;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Star field ── */
  #stars { position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden; }
  .star {
    position:absolute;border-radius:50%;background:white;
    animation:twinkle var(--dur) ease-in-out infinite;opacity:0;
  }
  @keyframes twinkle {
    0%,100%{opacity:0;} 50%{opacity:var(--max-op);}
  }

  /* ── App shell ── */
  #app {
    position:relative;z-index:1;
    display:flex;flex-direction:column;
    height:100vh;
  }

  /* ══════════════════════════════════════════════
     HEADER  —  wordmark centred, back left
  ══════════════════════════════════════════════ */
  header {
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    padding: 16px 32px 0;
    position:relative;
  }

  .back-btn {
    justify-self: start;
    display:inline-flex;align-items:center;gap:7px;
    font-family:'Cinzel',serif;
    font-size:9px;
    letter-spacing:0.26em;
    color:rgba(200,185,155,0.45);
    text-transform:uppercase;
    background:none;
    border:1px solid rgba(200,185,155,0.14);
    cursor:pointer;
    padding:7px 13px 7px 10px;
    border-radius:1px;
    transition:color 0.3s, border-color 0.3s, background 0.3s;
    white-space:nowrap;
  }
  .back-btn .arrow {
    font-size:12px;
    line-height:1;
    color:inherit;
    transition:transform 0.3s var(--ease);
  }
  .back-btn:hover {
    color:var(--active-primary);
    border-color:rgba(var(--active-rgb),0.4);
    background:rgba(255,255,255,0.025);
  }
  .back-btn:hover .arrow { transform:translateX(-3px); }

  .wordmark {
    justify-self:center;
    font-family:'Cinzel',serif;
    font-size:11px;
    letter-spacing:0.42em;
    color:var(--text-dim);
    text-transform:uppercase;
  }

  /* right spacer — keeps grid symmetric */
  .header-right { justify-self:end; width:80px; }

  /* ══════════════════════════════════════════════
     SEER NAV  —  compact three-tab switcher
  ══════════════════════════════════════════════ */
  .seer-nav {
    display:flex;
    justify-content:center;
    align-items:stretch;
    margin: 14px 32px 0;
    border:1px solid rgba(255,255,255,0.06);
    border-radius:2px;
    overflow:hidden;
    position:relative;
    /* subtle gradient behind the whole bar */
    background:rgba(255,255,255,0.018);
  }

  /* gliding active indicator */
  .seer-nav::after {
    content:'';
    position:absolute;
    bottom:0; left:0;
    height:1px;
    width:33.333%;
    background:var(--active-primary);
    transition:left 0.45s var(--ease), background 0.4s;
    box-shadow:0 0 10px var(--active-primary);
  }
  .seer-nav[data-active="maren"]::after { left:0%; }
  .seer-nav[data-active="aion"]::after  { left:33.333%; }
  .seer-nav[data-active="arya"]::after  { left:66.666%; }

  .seer-tab {
    flex:1;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:3px;
    padding:10px 8px;
    cursor:pointer;
    background:none;border:none;
    border-right:1px solid rgba(255,255,255,0.05);
    position:relative;
    transition:background 0.3s;
  }
  .seer-tab:last-child { border-right:none; }
  .seer-tab:hover { background:rgba(255,255,255,0.03); }

  .tab-sigil {
    font-size:13px;
    color:var(--tab-color);
    filter:drop-shadow(0 0 4px var(--tab-color));
    transition:filter 0.35s;
    line-height:1;
  }
  .seer-tab.active .tab-sigil {
    filter:drop-shadow(0 0 8px var(--tab-color)) drop-shadow(0 0 16px var(--tab-color));
  }

  .tab-name {
    font-family:'Cinzel',serif;
    font-size:8.5px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--tab-color);
    opacity:0.45;
    transition:opacity 0.35s;
  }
  .seer-tab.active .tab-name { opacity:1; }

  .tab-tradition {
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:10px;
    color:var(--text-dim);
    opacity:0;
    transition:opacity 0.35s;
    white-space:nowrap;
  }
  .seer-tab.active .tab-tradition { opacity:0.7; }

  /* ── Chat area ── */
  #chat-area {
    flex:1;
    overflow-y:auto;
    padding:28px 40px;
    display:flex;flex-direction:column;
    gap:26px;
    scrollbar-width:thin;
    scrollbar-color:var(--text-dim) transparent;
  }
  #chat-area::-webkit-scrollbar { width:3px; }
  #chat-area::-webkit-scrollbar-thumb { background:var(--text-dim); border-radius:2px; }

  /* ── Messages ── */
  .message {
    max-width:760px;
    animation:fadeUp 0.5s ease forwards;
    opacity:0;
  }
  @keyframes fadeUp {
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }

  .message.user { align-self:flex-end; text-align:right; }
  .message.user .bubble {
    display:inline-block;
    padding:11px 18px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:2px;
    font-style:italic;
    color:var(--text-secondary);
    font-size:16px;
  }

  .message.seer { align-self:flex-start; }
  .message.seer .seer-label {
    font-family:'Cinzel',serif;
    font-size:9.5px;
    letter-spacing:0.26em;
    text-transform:uppercase;
    color:var(--active-primary);
    margin-bottom:9px;
    opacity:0.75;
  }
  .message.seer .bubble {
    color:var(--text-primary);
    font-size:18px;
    line-height:1.85;
    white-space:pre-wrap;
  }

  .continue-btn {
    margin-top:13px;
    padding:7px 18px;
    background:none;
    border:1px solid var(--active-primary);
    color:var(--active-primary);
    font-family:'Cinzel',serif;
    font-size:9px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    cursor:pointer;
    opacity:0.65;
    transition:opacity 0.3s;
  }
  .continue-btn:hover { opacity:1; }

  /* Thinking dots */
  .thinking {
    align-self:flex-start;
    display:flex;gap:6px;align-items:center;
    padding:8px 0;opacity:0.5;
  }
  .thinking span {
    width:5px;height:5px;border-radius:50%;
    background:var(--active-primary);
    animation:pulse 1.4s ease-in-out infinite;
  }
  .thinking span:nth-child(2){animation-delay:0.2s;}
  .thinking span:nth-child(3){animation-delay:0.4s;}
  @keyframes pulse {
    0%,60%,100%{opacity:0.2;transform:scale(0.8);}
    30%{opacity:1;transform:scale(1);}
  }

  /* Welcome state */
  .welcome {
    flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    text-align:center;gap:14px;
    opacity:0;animation:fadeUp 0.8s 0.3s ease forwards;
  }
  .welcome-sigil {
    font-size:44px;margin-bottom:6px;
    filter:drop-shadow(0 0 18px var(--active-primary));
  }
  .welcome-name {
    font-family:'Cinzel',serif;
    font-size:20px;letter-spacing:0.15em;
    color:var(--active-primary);
  }
  .welcome-tradition {
    font-style:italic;color:var(--text-secondary);
    font-size:14px;max-width:460px;line-height:1.6;
  }

  /* ── Input zone ── */
  .input-zone {
    padding:18px 40px 28px;
    border-top:1px solid rgba(255,255,255,0.05);
    background:linear-gradient(to top, var(--void) 60%, transparent);
  }
  .input-row {
    display:flex;gap:12px;align-items:flex-end;
    max-width:840px;margin:0 auto;
  }
  textarea {
    flex:1;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:2px;
    padding:13px 16px;
    font-family:'Cormorant Garamond',serif;
    font-size:17px;
    color:var(--text-primary);
    resize:none;
    min-height:50px;max-height:160px;
    transition:border-color 0.3s;
    line-height:1.5;
  }
  textarea:focus { outline:none; border-color:var(--active-primary); }
  textarea::placeholder { color:var(--text-dim); font-style:italic; }

  button#send {
    padding:13px 22px;
    background:none;
    border:1px solid var(--active-primary);
    color:var(--active-primary);
    font-family:'Cinzel',serif;
    font-size:10px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    cursor:pointer;
    transition:background 0.3s, color 0.3s;
    white-space:nowrap;
    align-self:flex-end;
    height:50px;
  }
  button#send:hover { background:var(--active-primary); color:var(--void); }
  button#send:disabled { opacity:0.3; cursor:not-allowed; }

  /* ── Glow orb ── */
  .glow-orb {
    position:fixed;bottom:-200px;left:50%;
    transform:translateX(-50%);
    width:600px;height:400px;border-radius:50%;
    background:radial-gradient(ellipse, var(--active-glow) 0%, transparent 70%);
    pointer-events:none;transition:background 0.8s;z-index:0;
  }

  /* ── Veil ── */
  #back-veil {
    position:fixed;inset:0;background:#010008;
    z-index:100;opacity:0;pointer-events:none;
    transition:opacity 0.6s ease;
  }
</style>
</head>
<body>

<div id="stars"></div>
<div class="glow-orb" id="glowOrb"></div>
<div id="back-veil"></div>

<div id="app">

  <!-- ── Header ── -->
  <header>
    <button class="back-btn" onclick="goBack()">
      <span class="arrow">←</span>
      The Council
    </button>
    <div class="wordmark">Soul Interface</div>
    <div class="header-right"></div>
  </header>

  <!-- ── Seer nav ── -->
  <nav class="seer-nav" id="seerNav" data-active="maren">
    <button class="seer-tab active" data-seer="maren"
            style="--tab-color:#c9a96e" onclick="selectSeer('maren')">
      <span class="tab-sigil">☽</span>
      <span class="tab-name">Maren</span>
      <span class="tab-tradition">Tropical Astrology</span>
    </button>
    <button class="seer-tab" data-seer="aion"
            style="--tab-color:#b8a8d4" onclick="selectSeer('aion')">
      <span class="tab-sigil">⊕</span>
      <span class="tab-name">Aion</span>
      <span class="tab-tradition">Cosmogenesis</span>
    </button>
    <button class="seer-tab" data-seer="arya"
            style="--tab-color:#7b9ea8" onclick="selectSeer('arya')">
      <span class="tab-sigil">✦</span>
      <span class="tab-name">Arya</span>
      <span class="tab-tradition">Vedic · Jyotish</span>
    </button>
  </nav>

  <!-- ── Chat ── -->
  <div id="chat-area">
    <div class="welcome" id="welcome">
      <div class="welcome-sigil" id="welcomeSigil">☽</div>
      <div class="welcome-name"  id="welcomeName">Maren</div>
      <div class="welcome-tradition" id="welcomeTradition">
        Tropical astrologer. The chart is a confession the soul made before it forgot it was born.
      </div>
    </div>
  </div>

  <!-- ── Input ── -->
  <div class="input-zone">
    <div class="input-row">
      <textarea
        id="queryInput"
        rows="1"
        placeholder="Ask Maren..."
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button id="send" onclick="sendMessage()">Ask</button>
    </div>
  </div>

</div>

<script>
// ── Seer config ───────────────────────────────────────────────────────────────
const SEERS = {
  maren: {
    name:'Maren', tradition:'Tropical Astrology', sigil:'☽',
    description:'Tropical astrologer. The chart is a confession the soul made before it forgot it was born.',
    port:8000, endpoint:'maren',
    primaryColor:'#c9a96e', glowColor:'rgba(201,169,110,0.15)',
    placeholder:'Ask Maren...',
  },
  arya: {
    name:'Arya', tradition:'Vedic · Jyotish', sigil:'✦',
    description:'Vedic Jyotishi. The grahas are not symbols — they are living intelligences with their own natures.',
    port:8001, endpoint:'arya',
    primaryColor:'#7b9ea8', glowColor:'rgba(123,158,168,0.15)',
    placeholder:'Ask Arya...',
  },
  aion: {
    name:'Aion', tradition:'Cosmogenesis', sigil:'⊕',
    description:'Physicist. Cosmologist. The universe spent 13.8 billion years becoming capable of producing you. That is not an accident worth explaining away.',
    port:8002, endpoint:'aion',
    primaryColor:'#b8a8d4', glowColor:'rgba(184,168,212,0.15)',
    placeholder:'Ask Aion...',
  }
};

// ── State ─────────────────────────────────────────────────────────────────────
let activeSeer = 'maren';
let conversationHistories = { maren:[], arya:[], aion:[] };
let isLoading = false;
let lastQuery = '';

// ── Stars ─────────────────────────────────────────────────────────────────────
function initStars() {
  const container = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2 + 0.5;
    star.style.cssText = `
      width:${size}px;height:${size}px;
      left:${Math.random()*100}%;top:${Math.random()*100}%;
      --dur:${Math.random()*4+3}s;
      --max-op:${Math.random()*0.5+0.1};
      animation-delay:${Math.random()*5}s;
    `;
    container.appendChild(star);
  }
}

// ── Seer selection ────────────────────────────────────────────────────────────
function selectSeer(seerKey) {
  activeSeer = seerKey;
  const seer = SEERS[seerKey];

  // CSS variables
  const root = document.documentElement;
  root.style.setProperty('--active-primary', seer.primaryColor);
  root.style.setProperty('--active-glow',    seer.glowColor);

  // Nav: active tab + indicator
  document.querySelectorAll('.seer-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.seer === seerKey);
  });
  document.getElementById('seerNav').dataset.active = seerKey;

  // Placeholder
  document.getElementById('queryInput').placeholder = seer.placeholder;

  rebuildChat();
}

function rebuildChat() {
  const seer    = SEERS[activeSeer];
  const history = conversationHistories[activeSeer];
  const chatArea = document.getElementById('chat-area');
  chatArea.innerHTML = '';

  if (history.length === 0) {
    const welcome = document.createElement('div');
    welcome.className = 'welcome';
    welcome.innerHTML = `
      <div class="welcome-sigil">${seer.sigil}</div>
      <div class="welcome-name">${seer.name}</div>
      <div class="welcome-tradition">${seer.description}</div>
    `;
    chatArea.appendChild(welcome);
  } else {
    for (let i = 0; i < history.length; i++) {
      const item = history[i];
      if (item.role === 'user')      appendUserMessage(item.content, false);
      if (item.role === 'assistant') appendSeerMessage(item.content, false, false);
    }
  }
  chatArea.scrollTop = chatArea.scrollHeight;
}

// ── Message rendering ─────────────────────────────────────────────────────────
function appendUserMessage(text, animate = true) {
  const chatArea = document.getElementById('chat-area');
  const welcome  = chatArea.querySelector('.welcome');
  if (welcome) welcome.remove();

  const msg = document.createElement('div');
  msg.className = 'message user';
  if (!animate) msg.style.opacity = '1';
  msg.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
  chatArea.appendChild(msg);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function appendSeerMessage(text, animate = true, truncated = false) {
  const seer    = SEERS[activeSeer];
  const chatArea = document.getElementById('chat-area');
  const msg = document.createElement('div');
  msg.className = 'message seer';
  if (!animate) msg.style.opacity = '1';
  msg.innerHTML = `
    <div class="seer-label">${seer.name}</div>
    <div class="bubble">${escapeHtml(text)}</div>
    ${truncated ? `<button class="continue-btn" onclick="continueThought(this)">Continue thought →</button>` : ''}
  `;
  chatArea.appendChild(msg);
  chatArea.scrollTop = chatArea.scrollHeight;
  return msg;
}

function appendThinking() {
  const chatArea = document.getElementById('chat-area');
  const el = document.createElement('div');
  el.className = 'thinking'; el.id = 'thinking';
  el.innerHTML = '<span></span><span></span><span></span>';
  chatArea.appendChild(el);
  chatArea.scrollTop = chatArea.scrollHeight;
  return el;
}

// ── Send ──────────────────────────────────────────────────────────────────────
async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('queryInput');
  const query = input.value.trim();
  if (!query) return;

  lastQuery = query;
  input.value = '';
  autoResize(input);

  appendUserMessage(query);
  await callSeer(query, activeSeer, `http://localhost:${SEERS[activeSeer].port}/ask/${SEERS[activeSeer].endpoint}`);
}

async function continueThought(btn) {
  btn.remove();
  await callSeer(lastQuery, activeSeer, `http://localhost:${SEERS[activeSeer].port}/continue/${SEERS[activeSeer].endpoint}`, true);
}

async function callSeer(query, seerKey, url, isContinue = false) {
  isLoading = true;
  document.getElementById('send').disabled = true;
  const thinking = appendThinking();

  try {
    const res = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        query,
        n_results: 5,
        conversation_history: conversationHistories[seerKey]
      })
    });

    if (!res.ok) throw new Error(`${res.status}`);
    const data = await res.json();
    thinking.remove();

    if (!isContinue) {
      conversationHistories[seerKey].push({ role:'user', content:query });
    }
    conversationHistories[seerKey].push({ role:'assistant', content:data.response });
    appendSeerMessage(data.response, true, data.truncated || false);

  } catch (err) {
    thinking.remove();
    const chatArea = document.getElementById('chat-area');
    const errMsg = document.createElement('div');
    errMsg.className = 'message seer';
    errMsg.innerHTML = `
      <div class="seer-label" style="color:#a06060;">Connection</div>
      <div class="bubble" style="color:var(--text-secondary);font-style:italic;font-size:15px;">
        The server is not responding. Make sure ${SEERS[seerKey].name.toLowerCase()}.py is running on port ${SEERS[seerKey].port}.
      </div>
    `;
    chatArea.appendChild(errMsg);
    chatArea.scrollTop = chatArea.scrollHeight;
  } finally {
    isLoading = false;
    document.getElementById('send').disabled = false;
  }
}

// ── Utils ─────────────────────────────────────────────────────────────────────
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}
function escapeHtml(text) {
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/\n/g,'<br>');
}
function goBack() {
  const v = document.getElementById('back-veil');
  v.style.pointerEvents = 'all';
  v.style.opacity = '1';
  setTimeout(() => { window.location.href = 'index.html'; }, 620);
}

// ── Init ──────────────────────────────────────────────────────────────────────
const urlParams = new URLSearchParams(window.location.search);
const seerParam = urlParams.get('seer');
if (seerParam && SEERS[seerParam]) {
  activeSeer = seerParam;
  selectSeer(seerParam);
}
initStars();
</script>
</body>
</html>
